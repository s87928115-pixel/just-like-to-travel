<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>泰飽了要走走 - 行程助手</title>
    
    <!-- PWA & Apple Touch Icon 腳本 -->
    <script>
        (function() {
            try {
                const data = JSON.parse(localStorage.getItem('travelApp_TaiBaoLe_Final'));
                const iconUrl = (data && data.info && data.info.coverImg) ? data.info.coverImg : 'https://images.unsplash.com/photo-1537996194471-e657df975ab4?auto=format&fit=crop&w=192&q=80';
                const link = document.createElement('link');
                link.rel = 'apple-touch-icon';
                link.href = iconUrl;
                document.head.appendChild(link);
            } catch (e) { console.error('PWA Icon Load Error', e); }
        })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Noto+Sans+TC:wght@400;500;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        beige: '#F7F5F0',
                        darkwood: '#4A3E3D',
                        warmbrown: '#8C7667',
                        calmblue: '#4B6E7D',
                        highlight: '#D9534F'
                    },
                    fontFamily: {
                        noto: ['"Noto Sans TC"', 'sans-serif'],
                        klee: ['"Klee One"', 'cursive'],
                        zen: ['"Zen Maru Gothic"', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #F7F5F0; color: #4A3E3D; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .muji-card { background: #FFFFFF; border-radius: 12px; box-shadow: 0 4px 12px rgba(74, 62, 61, 0.06); border: 1px solid rgba(140, 118, 103, 0.1); }
        .tab-content { display: none; padding-bottom: 5rem; }
        .tab-content.active { display: block; }
        textarea { resize: none; }
        .glass-nav { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border-top: 1px solid rgba(140, 118, 103, 0.1); }
        /* 隱藏預設檔案上傳外觀 */
        input[type="file"] { display: none; }
    </style>
</head>
<body class="font-noto text-lg text-darkwood">

<div class="max-w-md mx-auto min-h-screen relative shadow-2xl bg-beige overflow-hidden flex flex-col">
    <!-- Header -->
    <header class="relative w-full h-48 bg-gray-200 shrink-0">
        <img id="headerCoverImg" src="https://images.unsplash.com/photo-1537996194471-e657df975ab4?auto=format&fit=crop&w=800&q=80" class="w-full h-full object-cover" alt="Cover">
        <div class="absolute inset-0 bg-gradient-to-t from-darkwood/70 to-transparent"></div>
        <div class="absolute bottom-4 left-4 right-4">
            <h1 class="text-3xl font-klee font-bold text-white tracking-widest drop-shadow-md">泰飽了要走走</h1>
            <p class="text-sm font-zen text-white/90 mt-1">Bangkok Trip - 5 Days</p>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 overflow-y-auto no-scrollbar p-4 relative" id="mainContainer">
        
        <!-- 1. PLAN 行程 -->
        <section id="tab-plan" class="tab-content active">
            <!-- Day Selector -->
            <div class="flex overflow-x-auto no-scrollbar gap-3 mb-5" id="planDaySelector"></div>
            
            <div class="muji-card p-5 mb-4 relative">
                <div class="flex justify-between items-center mb-4 border-b border-warmbrown/20 pb-2">
                    <h2 class="text-2xl font-zen font-bold text-warmbrown" id="planDayTitle">DAY 1</h2>
                    <button onclick="togglePlanEdit()" id="planEditBtn" class="text-sm bg-warmbrown text-white px-3 py-1 rounded-full shadow-sm"><i class="fas fa-pen mr-1"></i>編輯</button>
                </div>
                
                <!-- 檢視模式 -->
                <div id="planViewMode" class="whitespace-pre-wrap leading-relaxed text-[1.1rem]"></div>
                
                <!-- 編輯模式 -->
                <div id="planEditMode" class="hidden">
                    <textarea id="planTextarea" class="w-full h-64 p-3 border border-warmbrown/30 rounded-lg focus:outline-none focus:ring-2 focus:ring-warmbrown text-[1.1rem] bg-beige/30"></textarea>
                    <div class="mt-3 flex gap-2">
                        <label class="flex-1 text-center bg-calmblue text-white py-2 rounded-lg cursor-pointer text-sm shadow-sm">
                            <i class="fas fa-image mr-1"></i>上傳照片
                            <input type="file" accept="image/*" onchange="handlePlanImageUpload(event)">
                        </label>
                        <button onclick="savePlanEdit()" class="flex-1 bg-warmbrown text-white py-2 rounded-lg text-sm shadow-sm"><i class="fas fa-save mr-1"></i>儲存</button>
                    </div>
                </div>

                <!-- 每日照片預覽 -->
                <div id="planImageContainer" class="mt-4 hidden relative">
                    <img id="planImagePreview" src="" class="w-full rounded-lg shadow-sm object-cover max-h-60">
                    <button onclick="removePlanImage()" class="absolute bottom-4 right-4 bg-white/80 text-highlight p-2 rounded-full shadow backdrop-blur text-sm"><i class="fas fa-trash"></i></button>
                </div>
            </div>
        </section>

        <!-- 2. FOOD 美食 -->
        <section id="tab-food" class="tab-content">
            <h2 class="text-2xl font-zen font-bold text-warmbrown mb-4 pl-2 border-l-4 border-warmbrown">曼谷美食地圖</h2>
            <div id="foodContainer" class="space-y-6"></div>
        </section>

        <!-- 3. WALLET 記帳 -->
        <section id="tab-wallet" class="tab-content">
            <div class="muji-card p-5 mb-5 bg-warmbrown/5 border-none">
                <h3 class="font-zen font-bold text-warmbrown mb-3"><i class="fas fa-calculator mr-2"></i>匯率計算機</h3>
                <div class="flex gap-2 items-center mb-3">
                    <span class="text-sm">匯率設定：</span>
                    <input type="number" id="walletRate" value="0.9" step="0.01" class="w-20 p-1 border rounded text-center bg-white text-darkwood">
                </div>
                <div class="flex gap-2 items-center">
                    <input type="number" id="walletThb" placeholder="輸入泰銖 (THB)" class="flex-1 p-2 border rounded-lg bg-white text-darkwood text-lg" oninput="calculateRate()">
                    <i class="fas fa-arrow-right text-warmbrown"></i>
                    <div class="flex-1 p-2 bg-white rounded-lg border text-center font-bold text-calmblue" id="walletTwd">0 TWD</div>
                </div>
            </div>

            <div class="muji-card p-5">
                <div class="flex justify-between items-center border-b border-warmbrown/20 pb-2 mb-4">
                    <h3 class="font-zen font-bold text-warmbrown"><i class="fas fa-receipt mr-2"></i>記帳清單</h3>
                    <span class="text-sm font-bold text-calmblue">總計: <span id="walletTotal">0</span> TWD</span>
                </div>
                
                <!-- 新增記帳表單 -->
                <div class="flex flex-col gap-2 mb-4 p-3 bg-beige/50 rounded-lg">
                    <input type="text" id="expenseName" placeholder="項目名稱" class="p-2 border rounded-lg bg-white">
                    <div class="flex gap-2">
                        <input type="number" id="expenseCost" placeholder="花費(TWD)" class="flex-1 p-2 border rounded-lg bg-white">
                        <label class="bg-calmblue text-white px-4 py-2 rounded-lg cursor-pointer flex items-center justify-center shadow-sm text-sm">
                            <i class="fas fa-camera"></i>
                            <input type="file" accept="image/*" onchange="handleReceiptUpload(event)">
                        </label>
                    </div>
                    <img id="expenseReceiptPreview" class="hidden h-20 object-contain rounded mt-1">
                    <button onclick="addExpense()" class="w-full bg-warmbrown text-white py-2 rounded-lg font-bold shadow-sm mt-1">新增一筆</button>
                </div>

                <!-- 記帳列表 -->
                <div id="expenseList" class="space-y-3"></div>
            </div>
        </section>

        <!-- 4. LISTS 清單 -->
        <section id="tab-lists" class="tab-content">
            <!-- Sub Tabs -->
            <div class="flex bg-white rounded-full p-1 shadow-sm mb-5 font-zen text-sm">
                <button onclick="switchListTab('baggage')" id="subtab-baggage" class="flex-1 py-2 rounded-full font-bold bg-warmbrown text-white transition">行李</button>
                <button onclick="switchListTab('memo')" id="subtab-memo" class="flex-1 py-2 rounded-full font-bold text-warmbrown transition">備忘錄</button>
                <button onclick="switchListTab('shop')" id="subtab-shop" class="flex-1 py-2 rounded-full font-bold text-warmbrown transition">採購</button>
            </div>

            <!-- 行李 -->
            <div id="list-baggage" class="muji-card p-5">
                <div class="flex gap-2 mb-4">
                    <input type="text" id="baggageInput" placeholder="新增物品..." class="flex-1 p-2 border rounded-lg bg-beige/30">
                    <button onclick="addBaggage()" class="bg-calmblue text-white px-4 rounded-lg shadow-sm"><i class="fas fa-plus"></i></button>
                </div>
                <div id="baggageList" class="space-y-2"></div>
            </div>

            <!-- 備忘錄 -->
            <div id="list-memo" class="hidden">
                <div class="muji-card p-5 mb-4 relative">
                    <div class="flex justify-between items-center mb-2">
                        <h3 class="font-zen font-bold text-warmbrown">自由筆記</h3>
                        <button onclick="toggleMemoEdit()" id="memoEditBtn" class="text-sm bg-warmbrown text-white px-3 py-1 rounded-full"><i class="fas fa-pen mr-1"></i>編輯</button>
                    </div>
                    <div id="memoViewMode" class="whitespace-pre-wrap leading-relaxed min-h-[100px] text-[1.1rem]"></div>
                    <div id="memoEditMode" class="hidden">
                        <textarea id="memoTextarea" class="w-full h-40 p-3 border rounded-lg bg-beige/30 mb-2"></textarea>
                        <div class="flex gap-2">
                            <label class="flex-1 text-center bg-calmblue text-white py-2 rounded-lg cursor-pointer text-sm">
                                <i class="fas fa-image mr-1"></i>加圖片
                                <input type="file" accept="image/*" onchange="handleMemoImageUpload(event)">
                            </label>
                            <button onclick="saveMemoEdit()" class="flex-1 bg-warmbrown text-white py-2 rounded-lg text-sm"><i class="fas fa-save mr-1"></i>儲存</button>
                        </div>
                    </div>
                    <div id="memoImageContainer" class="mt-4 hidden relative">
                        <img id="memoImagePreview" src="" class="w-full rounded-lg shadow-sm">
                        <button onclick="removeMemoImage()" class="absolute top-2 right-2 bg-white/80 text-highlight p-2 rounded-full text-xs shadow"><i class="fas fa-times"></i></button>
                    </div>
                </div>
            </div>

            <!-- 採購型錄 -->
            <div id="list-shop" class="hidden">
                <div class="flex gap-2 mb-4 muji-card p-3">
                    <div class="flex-1 flex flex-col gap-2">
                        <input type="text" id="shopNameInput" placeholder="商品名稱" class="p-2 border rounded-lg bg-beige/30 text-sm">
                        <label class="bg-gray-100 border-dashed border-2 border-gray-300 text-gray-500 py-2 rounded-lg cursor-pointer text-center text-sm">
                            <i class="fas fa-upload mr-1"></i>上傳商品圖
                            <input type="file" accept="image/*" onchange="handleShopImageTemp(event)">
                        </label>
                        <img id="shopImageTemp" class="hidden h-16 object-contain rounded mx-auto">
                    </div>
                    <button onclick="addShopItem()" class="bg-calmblue text-white px-4 rounded-lg shadow-sm whitespace-nowrap"><i class="fas fa-plus mr-1"></i>加入</button>
                </div>
                <div id="shopGrid" class="grid grid-cols-3 gap-3"></div>
            </div>
        </section>

        <!-- 5. INFO 資訊 -->
        <section id="tab-info" class="tab-content">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-2xl font-zen font-bold text-warmbrown pl-2 border-l-4 border-warmbrown">旅途資訊</h2>
                <button onclick="toggleInfoEdit()" id="infoEditBtn" class="text-sm bg-warmbrown text-white px-3 py-1 rounded-full"><i class="fas fa-pen mr-1"></i>編輯</button>
            </div>

            <!-- 入境 QR Code 專區 -->
            <div class="muji-card p-5 mb-4">
                <h3 class="font-zen font-bold text-warmbrown border-b border-warmbrown/20 pb-2 mb-3"><i class="fas fa-qrcode mr-2"></i>入境 QR Code (截圖)</h3>
                <div class="flex flex-col items-center">
                    <img id="infoQrCodePreview" src="" class="w-full max-w-[250px] rounded-lg shadow-sm mb-3 hidden object-contain">
                    <label id="qrCodeUploadLabel" class="bg-calmblue text-white px-4 py-2 rounded-lg cursor-pointer text-sm shadow-sm transition hover:bg-calmblue/80">
                        <i class="fas fa-upload mr-1"></i>上傳 QR Code
                        <input type="file" accept="image/*" onchange="handleQrCodeUpload(event)">
                    </label>
                    <button id="removeQrBtn" onclick="removeQrCode()" class="mt-2 text-highlight text-sm hidden"><i class="fas fa-trash mr-1"></i>移除重新上傳</button>
                </div>
            </div>

            <!-- 住宿與航班 -->
            <div class="space-y-4" id="infoContainer">
                <!-- 內容由 JS 渲染 -->
            </div>

            <div class="muji-card p-4 mt-6 border-t-4 border-calmblue">
                <h3 class="font-zen font-bold text-calmblue mb-3"><i class="fas fa-cog mr-2"></i>APP 設定</h3>
                <label class="block w-full text-center bg-beige border-2 border-dashed border-warmbrown/50 text-warmbrown py-3 rounded-lg cursor-pointer font-bold transition hover:bg-warmbrown/10">
                    <i class="fas fa-image mr-2"></i>更換首頁封面圖
                    <input type="file" accept="image/*" onchange="updateCoverImage(event)">
                </label>
            </div>
        </section>

    </main>

    <!-- Bottom Navigation -->
    <nav class="glass-nav absolute bottom-0 w-full h-16 flex justify-around items-center z-50 rounded-t-2xl shadow-[0_-4px_20px_rgba(0,0,0,0.05)] px-2 pb-safe">
        <button onclick="switchTab('plan', this)" class="nav-btn active flex flex-col items-center justify-center w-16 h-full text-warmbrown">
            <i class="fas fa-calendar-alt text-xl mb-1"></i>
            <span class="text-[10px] font-bold">行程</span>
        </button>
        <button onclick="switchTab('food', this)" class="nav-btn flex flex-col items-center justify-center w-16 h-full text-gray-400 hover:text-warmbrown transition">
            <i class="fas fa-utensils text-xl mb-1"></i>
            <span class="text-[10px] font-bold">美食</span>
        </button>
        <button onclick="switchTab('wallet', this)" class="nav-btn flex flex-col items-center justify-center w-16 h-full text-gray-400 hover:text-warmbrown transition">
            <i class="fas fa-wallet text-xl mb-1"></i>
            <span class="text-[10px] font-bold">記帳</span>
        </button>
        <button onclick="switchTab('lists', this)" class="nav-btn flex flex-col items-center justify-center w-16 h-full text-gray-400 hover:text-warmbrown transition">
            <i class="fas fa-list-check text-xl mb-1"></i>
            <span class="text-[10px] font-bold">清單</span>
        </button>
        <button onclick="switchTab('info', this)" class="nav-btn flex flex-col items-center justify-center w-16 h-full text-gray-400 hover:text-warmbrown transition">
            <i class="fas fa-passport text-xl mb-1"></i>
            <span class="text-[10px] font-bold">資訊</span>
        </button>
    </nav>
</div>

    /* ================= 核心工具函數 ================= */
    const STORAGE_KEY = 'travelApp_TaiBaoLe_Final';
    
    function loadData() {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
            return JSON.parse(stored);
        } else {
            saveData(initialData);

        }

    function saveData(data) {

    // 圖片壓縮 (Canvas)
    function compressImage(file, callback) {
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const MAX_WIDTH = 800;
                let width = img.width;
                let height = img.height;

                if (width > MAX_WIDTH) {
                    height = Math.round(height * (MAX_WIDTH / width));
                    width = MAX_WIDTH;
                }
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                // 壓縮為 JPEG 格式，品質 0.6
                callback(canvas.toDataURL('image/jpeg', 0.6));
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    // 文字解析：自動轉換連結與時間標示
    function parseText(text) {
        if (!text) return "";
        let parsed = text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
        
        // 標記時間 (例如 09:25, 14:00, 6:05) 變為紅色
        parsed = parsed.replace(/(\b\d{1,2}:\d{2}\b)/g, '<span class="text-highlight font-bold font-zen">$1</span>');
        
        // 標記連結
        const urlRegex = /(https?:\/\/[^\s\)]+)/g;
        parsed = parsed.replace(urlRegex, function(url) {
            return `<a href="${url}" target="_blank" class="inline-block mt-1 mb-1 px-4 py-1.5 bg-calmblue/10 text-calmblue border border-calmblue/30 rounded-full text-sm font-bold no-underline active:bg-calmblue/20 transition"><i class="fas fa-map-marker-alt mr-1"></i> 開啟地圖/連結</a>`;
        });
        
        return parsed;
    }

        document.getElementById('tab-' + tabId).classList.add('active');

        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.classList.remove('text-warmbrown', 'active');
            btn.classList.add('text-gray-400');
        });
        if (btnElement) {
            btnElement.classList.remove('text-gray-400');
            btnElement.classList.add('text-warmbrown', 'active');
        }
        
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

            btn.classList.remove('bg-warmbrown', 'text-white');
            btn.classList.add('text-warmbrown');
        });
        document.getElementById(`list-${type}`).classList.remove('hidden');
        let activeBtn = document.getElementById(`subtab-${type}`);
