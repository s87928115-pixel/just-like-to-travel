    <!-- PWA Dynamic Icon Script -->
    <script>
        (function() {
            try {
                const data = JSON.parse(localStorage.getItem('travelAppData_BKK')) || {};
                if(data.images && data.images.cover) {
                    const link = document.createElement('link');
                    link.rel = 'apple-touch-icon';
                    link.href = data.images.cover;
                    document.head.appendChild(link);

</head>

    // ================= DATA INITIALIZATION =================

    let appData = {
        plan: {
            "11/19": "出發：早上6:05高鐵 6:47到桃園，機捷7:02/7:17\n第二航廈JX741\n09:25 飛機到泰國 12:35\n先到機場 B層換匯區換錢，旁邊就是機場快線乘車處，再搭曼谷機場快線 Airport Rail Link到旅館，若人太多可到捷運終點站 PHAYA THAI站，出站前往 BTS的路上，就有一間 SuperRich。\n住宿在淺綠線捷運的Ekkamai站，機捷的最終站可以跟他直接連接\n16:30 出門到喬德夜市(https://maps.app.goo.gl/koPMjyKzWQdtdSYF9) 或是新夜市Save One Go Night Market (https://maps.app.goo.gl/djUgooXf2RUcwgwX6)\n逛完回旅館休息",
            "11/20": "07:30 在Ekkamai Wat That Thong (https://maps.app.goo.gl/E2bPMt9qLvkamNR87) 集合坐園方的車子到大象保護區，體驗大概四小時(午餐在裡面吃)，回程時間 14:30 從園區出發，路程大約都各1.5小時\n16:30 在市區的centralwOrld逛逛或是班嘉奇蒂公園的森林天空步道走走\n18:30-19:00 晚餐吃泰式料理",
            "11/21": "DAY3 (包車)\n08:00 出門到丹嫩莎朵水上市場+美功鐵道市場\n14:00 回市區的朱拉大學美食街吃午餐或是紅大哥水門雞飯\n晚上去按摩",
            "11/22": "DAY4 (包車)\n09:00 - 12:00 恰圖恰市集 (BTS Mo Chit 站)\n12:30 - 13:30 勝利紀念碑吃船麵 (BTS Victory Monument 站)\n14:00 - 15:30 鄭王廟行程 (到 Saphan Taksin 站轉搭交通船)\n15:40 - 16:50 從鄭王廟離開，準備前往商場\n19:30 準時享用 Copper Beyond Buffet\n飯後 步行前往對面 Big C 補貨，開心回飯店！",
            "11/23": "DAY5\n準備回程\n阿姨回程 13:45 班次JX742\n其他人回程 17:40 班次JX746"
        },
        food: [
            { cat: "📍 住宿區周邊 (Ekkamai/Thong Lo)", items: [
                {n: "Tamnak Isan Ekamai", url: "https://maps.app.goo.gl/Uehp1Gs2uWMHpz2d9"},
                {n: "Mother May I Kitchen", url: "https://maps.app.goo.gl/D5qKigaLM29DcnYT7"},
                {n: "Hereduan (段哥街頭美食)", url: "https://maps.app.goo.gl/W1bgvDwFzHQaXgRcA"},
                {n: "Mae Varee 芒果糯米飯", url: "https://maps.app.goo.gl/rMihuDup2LsVBcZD8"},
                {n: "Goji Kitchen+Bar", url: "https://maps.app.goo.gl/3YN1YaU9cYUcnMhd9"}
            ]},
            { cat: "📍 購物市中心與水門區", items: [
                {n: "中央世界購物商場", url: "https://maps.app.goo.gl/qryGjwxrZSRR4zWd6"},
                {n: "Copper Beyond Buffet", url: "https://maps.app.goo.gl/SayZdEX69gTLshWe8"},
                {n: "紅大哥水門雞飯店", url: "https://maps.app.goo.gl/vqSep8wiTSvx9cRu8"},
                {n: "Thong Smith 船麵", url: "https://maps.app.goo.gl/d7yGmXAK78QMx2De8"}
            ]},
            { cat: "📍 朱拉隆功大學商圈", items: [
                {n: "Kampang ISAN", url: "https://maps.app.goo.gl/P4DGn5JhFD3jJFS67"},
                {n: "Nueng Nom Nua 牛奶小子", url: "https://maps.app.goo.gl/ToQgo4q54G5QFauv6"},
                {n: "朱拉50巷廚房", url: "https://maps.app.goo.gl/pbSx2tyqFEDSsz717"}
            ]},
            { cat: "📍 老城區與其他", items: [
                {n: "唐人街夜市", url: "https://maps.app.goo.gl/wdUhsNYcvksixmPf9"},
                {n: "拍那空船麵(勝利紀念碑)", url: "https://maps.app.goo.gl/d5axyjMX5GHiQisQ7"},
                {n: "Save One Go 夜市", url: "https://maps.app.goo.gl/jDgaMVq4yfC2aqDz7"}
            ]}
        ],
        info: "【班機時刻】\n去程：09:25 JX741 -> 12:35 BKK\n阿姨回程：13:45 JX742 -> 18:25 TPE\n其他人回程：17:40 JX746 -> 22:30 TPE\n\n【住宿地址】\n民宿：House36 Ekkamai\nhttps://maps.app.goo.gl/3WZ1nSZvPJKmALZ96\n\n飯店：Somerset Ekamai Bangkok\nhttps://maps.app.goo.gl/LM8E4JM69iX4pvDf9",
        wallet: { rate: 0.93, expenses: [] },
        lists: {
            luggage: [{text: "護照與簽證", checked: false}, {text: "泰銖現金", checked: false}, {text: "網卡", checked: false}],
            memo: "記得帶防蚊液跟腸胃藥！",
            shopping: []
        },
        images: {} // 'plan_11/19', 'cover', 'contract', 'memo'
    };

    let currentPlanDay = Object.keys(appData.plan)[0];

    // ================= CORE FUNCTIONS =================
    function init() {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
            // merge data to avoid missing structure
            const parsed = JSON.parse(stored);
            appData = { ...appData, ...parsed, lists: { ...appData.lists, ...parsed.lists } };
        }
        
        renderPlanTabs();
        renderPlanContent();
        renderFood();
        renderWallet();
        renderLuggage();
        renderShopping();
        renderMemo();
        renderInfo();
        
        // Initial View
        document.getElementById('view-plan').classList.remove('hidden');
        document.querySelector('.nav-btn').style.color = '#8C7667';
    }

    function saveData() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
    }

    function clearAllData() {
        if(confirm("確定要刪除所有紀錄(包含照片、記帳)並重置嗎？")) {
            localStorage.removeItem(STORAGE_KEY);
            location.reload();
        }
    }

    // Text formatting (Auto-link & Time Highlight)
    function formatText(text) {
        if(!text) return "";
        let html = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        // Auto-link https://...
        html = html.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" class="auto-link-btn shadow-sm"><i class="fa-solid fa-map-location-dot"></i> 點擊開啟地圖</a>');
        // Time Highlight
        html = html.replace(/\b([01]?[0-9]|2[0-3]):([0-5][0-9])\b/g, '<span class="time-highlight"><i class="fa-regular fa-clock text-sm"></i> $1:$2</span>');
        return html.replace(/\n/g, '<br>');
    }

    // Image Compression
    function compressImage(file, callback) {
        if (!file) return;
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = event => {
            const img = new Image();
            img.src = event.target.result;
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const MAX_WIDTH = 800;
                let width = img.width;
                let height = img.height;
                if (width > MAX_WIDTH) {
                    height = height * (MAX_WIDTH / width);
                    width = MAX_WIDTH;
                }
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                // Compress quality to 0.6
                callback(canvas.toDataURL('image/jpeg', 0.6));
            }
        }
    }

    function uploadImage(input, type) {
        const file = input.files[0];
        if(!file) return;
        compressImage(file, base64 => {
            let key = type;
            if(type === 'plan') key = `plan_${currentPlanDay}`;
            appData.images[key] = base64;
            saveData();
            
            // Re-render specific part
            if(type === 'plan') renderPlanContent();
            if(type === 'cover' || type === 'contract') renderInfo();
            if(type === 'memo') renderMemo();
        });
    }

    // ================= NAVIGATION =================
    function switchMainTab(tabId, btnElement) {
        document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));
        document.getElementById(`view-${tabId}`).classList.remove('hidden');
        
        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.style.color = 'rgba(74, 62, 61, 0.4)'; // textMain/40
        });
        btnElement.style.color = '#8C7667'; // accentBtn
        document.getElementById('headerTitle').innerText = 
            tabId==='plan'?'行程 📅' : tabId==='food'?'美食地圖 🍜' : tabId==='wallet'?'記帳與算式 💰' : tabId==='lists'?'清單 📝' : '行程資訊 ℹ️';
    }

    // ================= PLAN LOGIC =================
    function renderPlanTabs() {
        const container = document.getElementById('planTabs');
        container.innerHTML = '';
        Object.keys(appData.plan).forEach((day, index) => {
            const btn = document.createElement('button');
            const isSelected = day === currentPlanDay;
            btn.className = `flex-shrink-0 px-4 py-2 rounded-full font-bold font-zen text-sm transition-colors ${isSelected ? 'bg-accentBtn text-white shadow-md' : 'bg-white text-textMain/60 border border-gray-200'}`;
            btn.innerText = `Day ${index+1} (${day})`;
            btn.onclick = () => { currentPlanDay = day; renderPlanTabs(); renderPlanContent(); };
            container.appendChild(btn);
        });
    }

    function renderPlanContent() {
        const content = appData.plan[currentPlanDay] || "";
        const imgBase64 = appData.images[`plan_${currentPlanDay}`];
        
        document.getElementById('planDayTitle').innerText = `📍 ${currentPlanDay} 行程`;
        document.getElementById('planContentDisplay').innerHTML = formatText(content);
        document.getElementById('planContentEdit').value = content;
        
        const imgEl = document.getElementById('planImgDisplay');
        if(imgBase64) {
            imgEl.src = imgBase64;
            imgEl.classList.remove('hidden');
        } else {
            imgEl.classList.add('hidden');
        }
    }

    function toggleEdit(type) {
        const display = document.getElementById(`${type}ContentDisplay`);
        const edit = document.getElementById(`${type}ContentEdit`);
        const btn = document.getElementById(`${type}SaveBtn`);
        
        if (edit.classList.contains('hidden')) {
            display.classList.add('hidden');
            edit.classList.remove('hidden');
            btn.classList.remove('hidden');
            edit.focus();
        }
    }

    function savePlan() {
        appData.plan[currentPlanDay] = document.getElementById('planContentEdit').value;
        saveData();
        document.getElementById('planContentDisplay').classList.remove('hidden');
        document.getElementById('planContentEdit').classList.add('hidden');
        document.getElementById('planSaveBtn').classList.add('hidden');
        renderPlanContent();
    }

    // ================= FOOD LOGIC =================
    function renderFood() {
        const container = document.getElementById('foodList');
        container.innerHTML = '';
        appData.food.forEach(section => {
            let html = `<div class="muji-card"><h3 class="font-bold text-accentBlue mb-3 font-zen">${section.cat}</h3><div class="space-y-2">`;
            section.items.forEach(item => {
                html += `
                    <a href="${item.url}" target="_blank" class="block bg-base hover:bg-[#eaf1f4] p-3 rounded-lg flex justify-between items-center transition-colors">
                        <span class="font-bold text-textMain">${item.n}</span>
                        <i class="fa-solid fa-diamond-turn-right text-accentBtn"></i>
                    </a>`;
            });
            html += `</div></div>`;
            container.innerHTML += html;
        });
    }

    // ================= WALLET LOGIC =================
    function calcExchange() {
        const rate = parseFloat(document.getElementById('exRate').value) || 0.93;
        appData.wallet.rate = rate;
        saveData();
        const input = parseFloat(document.getElementById('calcInput').value) || 0;
        document.getElementById('calcResult').innerText = Math.round(input * rate);
    }

    function renderWallet() {
        document.getElementById('exRate').value = appData.wallet.rate;
        const list = document.getElementById('expenseList');
        list.innerHTML = '';
        let total = 0;
        
        [...appData.wallet.expenses].reverse().forEach((exp, idx) => {
            total += Number(exp.amount);
            const actualIdx = appData.wallet.expenses.length - 1 - idx;
            list.innerHTML += `
                <div class="muji-card !mb-0 !p-3 flex items-center justify-between">
                    <div>
                        <div class="font-bold text-lg">${exp.name}</div>
                        <div class="text-xs text-textMain/50">${exp.date}</div>
                        ${exp.img ? `<img src="${exp.img}" class="w-12 h-12 object-cover rounded mt-1" onclick="alert('收據已儲存')">` : ''}
                    </div>
                    <div class="text-right">
                        <div class="font-bold text-accentBtn text-xl">${exp.amount} ฿</div>
                        <button onclick="delExpense(${actualIdx})" class="text-xs text-red-400 mt-1"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>`;
        });
        document.getElementById('totalExp').innerText = total;
    }

    function addExpense() {
        const name = document.getElementById('expName').value;
        const amount = document.getElementById('expAmount').value;
        const file = document.getElementById('expReceipt').files[0];
        
        if(!name || !amount) return alert('請輸入項目與金額');
        
        const saveExp = (imgBase64) => {
            const date = new Date().toLocaleDateString('zh-TW', {month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'});
            appData.wallet.expenses.push({ name, amount, date, img: imgBase64 });
            saveData();
            document.getElementById('expName').value = '';
            document.getElementById('expAmount').value = '';
            document.getElementById('expReceipt').value = '';
            renderWallet();
        };

        if(file) compressImage(file, saveExp);
        else saveExp(null);
    }

    function delExpense(idx) {
        if(confirm('確定刪除此筆記帳？')) {
            appData.wallet.expenses.splice(idx, 1);
            saveData();
            renderWallet();
        }
    }

    // ================= LISTS LOGIC =================
    function switchListTab(tab) {
        document.querySelectorAll('.list-content').forEach(el => el.classList.add('hidden'));
        document.getElementById(`list${tab.charAt(0).toUpperCase() + tab.slice(1)}`).classList.remove('hidden');
        
        ['Luggage', 'Shopping', 'Memo'].forEach(t => {
            const btn = document.getElementById(`tab${t}`);
            if(t.toLowerCase() === tab) {
                btn.className = "flex-1 pb-2 text-center font-bold text-accentBtn border-b-2 border-accentBtn";
            } else {
                btn.className = "flex-1 pb-2 text-center font-bold text-textMain/50";
            }
        });
    }

    function renderLuggage() {
        const container = document.getElementById('luggageItems');
        container.innerHTML = '';
        appData.lists.luggage.forEach((item, idx) => {
            container.innerHTML += `
                <div class="flex items-center gap-3 bg-white p-3 rounded-lg shadow-sm" onclick="toggleLuggage(${idx})">
                    <div class="w-6 h-6 rounded-full border-2 ${item.checked ? 'bg-accentBlue border-accentBlue text-white' : 'border-gray-300'} flex items-center justify-center">
                        ${item.checked ? '<i class="fa-solid fa-check text-xs"></i>' : ''}
                    </div>
                    <span class="flex-1 ${item.checked ? 'line-through text-gray-400' : 'font-bold'}">${item.text}</span>
                    <button onclick="event.stopPropagation(); delLuggage(${idx})" class="text-gray-300 hover:text-red-400"><i class="fa-solid fa-times"></i></button>
                </div>`;
        });
    }

    function toggleLuggage(idx) {
        appData.lists.luggage[idx].checked = !appData.lists.luggage[idx].checked;
        saveData(); renderLuggage();
    }
    function addLuggage() {
        const v = document.getElementById('newLuggage').value;
        if(v) { appData.lists.luggage.push({text:v, checked:false}); saveData(); document.getElementById('newLuggage').value=''; renderLuggage(); }
    }
    function delLuggage(idx) {
        appData.lists.luggage.splice(idx, 1); saveData(); renderLuggage();
    }

    function renderShopping() {
        const container = document.getElementById('shoppingGrid');
        container.innerHTML = '';
        appData.lists.shopping.forEach((item, idx) => {
            container.innerHTML += `
                <div class="bg-white rounded-lg shadow-sm overflow-hidden flex flex-col relative" onclick="toggleShopping(${idx})">
                    <div class="absolute top-1 right-1 z-10 w-6 h-6 rounded-full bg-white shadow flex items-center justify-center">
                        ${item.checked ? '<i class="fa-solid fa-check text-accentBlue"></i>' : '<i class="fa-solid fa-circle text-gray-200"></i>'}
                    </div>
                    <div class="h-24 bg-gray-100 flex items-center justify-center relative">
                        ${item.img ? `<img src="${item.img}" class="w-full h-full object-cover ${item.checked ? 'opacity-50' : ''}">` : '<i class="fa-solid fa-bag-shopping text-gray-300 text-2xl"></i>'}
                        ${item.checked ? '<div class="absolute inset-0 bg-black/10"></div>' : ''}
                    </div>
                    <div class="p-2 text-center text-sm font-bold truncate ${item.checked ? 'line-through text-gray-400' : ''}">${item.name}</div>
                    <button onclick="event.stopPropagation(); delShopping(${idx})" class="absolute bottom-1 right-1 text-red-400/50 hover:text-red-400 text-xs"><i class="fa-solid fa-trash"></i></button>
                </div>`;
        });
    }

    function addShopping() {
        const name = document.getElementById('newShopName').value;
        const file = document.getElementById('newShopImg').files[0];
        if(!name) return alert('請輸入商品名稱');
        
        const saveShop = (img) => {
            appData.lists.shopping.push({name, img, checked:false});
            saveData();
            document.getElementById('newShopName').value='';
            document.getElementById('newShopImg').value='';
            renderShopping();
        }
        if(file) compressImage(file, saveShop);
        else saveShop(null);
    }
    function toggleShopping(idx) { appData.lists.shopping[idx].checked = !appData.lists.shopping[idx].checked; saveData(); renderShopping(); }
    function delShopping(idx) { appData.lists.shopping.splice(idx, 1); saveData(); renderShopping(); }

    function renderMemo() {
        const memo = appData.lists.memo;
        document.getElementById('memoContentDisplay').innerHTML = formatText(memo);
        document.getElementById('memoContentEdit').value = memo;
        const img = appData.images['memo'];
        const imgEl = document.getElementById('memoImgDisplay');
        if(img) { imgEl.src = img; imgEl.classList.remove('hidden'); }
    }
    function saveMemo() {
        appData.lists.memo = document.getElementById('memoContentEdit').value;
        saveData();
        document.getElementById('memoContentDisplay').classList.remove('hidden');
        document.getElementById('memoContentEdit').classList.add('hidden');
        document.getElementById('memoSaveBtn').classList.add('hidden');
        renderMemo();
    }

    // ================= INFO LOGIC =================
    function renderInfo() {
        document.getElementById('infoContentDisplay').innerHTML = formatText(appData.info);
        document.getElementById('infoContentEdit').value = appData.info;
        
        if(appData.images.cover) {
            const c = document.getElementById('coverImgContainer');
            c.style.backgroundImage = `url(${appData.images.cover})`;
            c.innerHTML = '';
        }
        if(appData.images.contract) {
            const imgEl = document.getElementById('contractImgDisplay');
            imgEl.src = appData.images.contract;
            imgEl.classList.remove('hidden');
        }
    }
    function saveInfo() {
        appData.info = document.getElementById('infoContentEdit').value;
        saveData();
        document.getElementById('infoContentDisplay').classList.remove('hidden');
        document.getElementById('infoContentEdit').classList.add('hidden');
        document.getElementById('infoSaveBtn').classList.add('hidden');
        renderInfo();
    }

    // Initialize App
    init();
</script>
</body>
</html>
