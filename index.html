<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>沖繩夏日慢旅 - 精簡旅遊APP</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: 融入無印風與日系文青感 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Noto+Sans+TC:wght@300;400;500;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            /* 採用圓潤的 Zen Maru Gothic 與 Noto Sans TC 搭配 */
            font-family: 'Zen Maru Gothic', 'Noto Sans TC', sans-serif;
            background-color: #F7F5F0; /* 無印經典米白 */
            color: #4A3E3D; /* 深木褐 */
        }
        .muji-card {
            background-color: #FFFFFF;
            border: 1px solid #E6E1DA;
            border-radius: 12px;
            box-shadow: 0 4px 12px rgba(74, 62, 61, 0.04);
        }
        .muji-btn-primary {
            background-color: #8C7667; /* 暖褐 */
            color: #FFFFFF;
        }
        .muji-btn-primary:active { background-color: #735F52; }
        
        .muji-btn-accent {
            background-color: #4B6E7D; /* 沉穩海藍 */
            color: #FFFFFF;
        }
        .muji-btn-accent:active { background-color: #385563; }
        
        /* 隱藏滾動條但保持可滾動 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="pb-24 max-w-md mx-auto relative min-h-screen shadow-xl bg-[#F7F5F0]">

    <!-- 全局圖片放大 Modal -->
    <div id="imageModal" class="fixed inset-0 bg-black/85 z-[60] hidden flex items-center justify-center p-4 transition-opacity" onclick="closeImageModal()">
        <img id="modalTargetImg" src="" class="max-w-full max-h-[85vh] rounded-lg shadow-2xl object-contain">
    </div>

    <!-- 頂部封面與航班快訊 -->
    <header class="relative w-full h-52 bg-neutral-300 overflow-hidden group rounded-b-2xl shadow-sm">
        <img id="coverImage" src="https://images.unsplash.com/photo-1542640244-7e672d6cef4e?q=80&w=600&auto=format&fit=crop" class="w-full h-full object-cover">
        <div class="absolute inset-0 bg-gradient-to-t from-[#4A3E3D]/80 via-transparent to-transparent flex flex-col justify-end p-5">
            <div class="flex justify-between items-end">
                <div>
                    <h1 class="text-white text-2xl font-bold tracking-widest font-['Klee_One']">沖繩夏日慢旅</h1>
                    <p class="text-neutral-200 text-xs mt-1.5"><i class="fa-regular fa-calendar-days mr-1"></i> 6/13 - 6/15</p>
                </div>
                <label class="bg-white/20 text-white text-xs px-2.5 py-1.5 rounded-full backdrop-blur-md cursor-pointer hover:bg-white/30 transition shadow">
                    <i class="fa-solid fa-camera mr-1"></i>換封面
                    <input type="file" id="coverUpload" accept="image/*" class="hidden" onchange="uploadCover(this)">
                </label>
            </div>
        </div>
    </header>

    <!-- 快捷航班動態列 -->
    <div class="bg-[#EADFC9] mx-4 -mt-4 relative z-10 rounded-xl px-4 py-3 text-xs flex justify-between items-center text-[#5C4A42] font-medium shadow-md border border-[#E6E1DA]">
        <div class="flex flex-col items-center"><span class="text-[10px] text-[#8C7667] mb-0.5">去程 6/13</span><div class="font-bold text-sm">13:30 <i class="fa-solid fa-plane text-[10px] mx-1"></i> 15:55</div></div>
        <div class="w-px h-8 bg-[#8C7667]/30 mx-2"></div>
        <div class="flex flex-col items-center"><span class="text-[10px] text-[#8C7667] mb-0.5">回程 6/15</span><div class="font-bold text-sm">20:10 <i class="fa-solid fa-plane text-[10px] mx-1"></i> 20:50</div></div>
    </div>

    <!-- 主要內容抽換區 -->
    <main class="p-4 mt-2" id="mainContent">
        <!-- JS 將會動態渲染各分頁內容於此 -->
    </main>

    <!-- 底部導航列 (翻頁式導覽) -->
    <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white/90 backdrop-blur-md border-t border-[#E6E1DA] h-16 flex justify-around items-center z-40 px-2 shadow-[0_-2px_10px_rgba(0,0,0,0.02)]">
        <button onclick="switchTab('plan')" id="nav-plan" class="flex flex-col items-center justify-center w-14 text-xs font-medium transition">
            <i class="fa-regular fa-compass text-xl mb-1"></i><span>行程</span>
        </button>
        <button onclick="switchTab('food')" id="nav-food" class="flex flex-col items-center justify-center w-14 text-xs font-medium transition text-neutral-400">
            <i class="fa-solid fa-utensils text-xl mb-1"></i><span>美食</span>
        </button>
        <button onclick="switchTab('wallet')" id="nav-wallet" class="flex flex-col items-center justify-center w-14 text-xs font-medium transition text-neutral-400">
            <i class="fa-solid fa-wallet text-xl mb-1"></i><span>記帳</span>
        </button>
        <button onclick="switchTab('lists')" id="nav-lists" class="flex flex-col items-center justify-center w-14 text-xs font-medium transition text-neutral-400">
            <i class="fa-solid fa-list-check text-xl mb-1"></i><span>清單</span>
        </button>
        <button onclick="switchTab('info')" id="nav-info" class="flex flex-col items-center justify-center w-14 text-xs font-medium transition text-neutral-400">
            <i class="fa-solid fa-circle-info text-xl mb-1"></i><span>資訊</span>
        </button>
    </nav>

    <!-- 基礎資料結構與 JavaScript 控制器 -->
    <script>
        // 初始化預設資料 (依照您提供的最新行程)
        const defaultPlan = [
            { day: 1, date: "6/13", items: [
                { time: "13:30", text: "✈️ 去程航班起飛 (13:30-15:55)", important: true, url: "" },
                { time: "16:30", text: "🚗 辦理租車手續", important: false, url: "" },
                { time: "17:30", text: "🏨 抵達民宿 Check-in", important: false, url: "https://maps.app.goo.gl/MeW62ReoSn7VCpN49" },
                { time: "18:00", text: "🐈 貓的道散步", important: false, url: "https://maps.app.goo.gl/EvJRi6NRJBw4ktMn6" },
                { time: "18:45", text: "🎡 美國村散策", important: false, url: "https://maps.app.goo.gl/fKZUZkqhmxh1bvKu5" },
                { time: "20:00", text: "🍽️ 享用晚餐", important: false, url: "" }
            ]},
            { day: 2, date: "6/14", items: [
                { time: "09:30", text: "🏝️ 古宇利島絕景", important: false, url: "https://maps.app.goo.gl/A6KbengUB6K2rRbg9" },
                { time: "11:30", text: "🦈 沖繩美麗海水族館", important: false, url: "https://maps.app.goo.gl/fnjwVkwC1VzncTLW9" },
                { time: "13:30", text: "🍽️ 午餐", important: false, url: "" },
                { time: "15:30", text: "⛩️ 波上宮參拜 (❗需於四點前抵達)", important: true, url: "https://maps.app.goo.gl/W3QwpRtVXTqjSLLw5" },
                { time: "16:30", text: "🌅 賴長島 (Umikaji Terrace)", important: false, url: "https://maps.app.goo.gl/B5SxaRWn8Dw76rjZ9" },
                { time: "19:00", text: "🛍️ 國際通吃晚餐", important: false, url: "" }
            ]},
            { day: 3, date: "6/15", items: [
                { time: "10:00", text: "🛍️ PARCO CITY 商場", important: false, url: "https://maps.app.goo.gl/5WQcTJTFEtC8THjB8" },
                { time: "12:30", text: "🍽️ 午餐", important: false, url: "" },
                { time: "14:00", text: "🚗 開車準備送機", important: false, url: "" },
                { time: "15:00", text: "🛒 好市多採購", important: false, url: "https://maps.app.goo.gl/pepucERz8Zs2zqwH8" },
                { time: "19:40", text: "🎒 準備搭機 (出發前保留半小時)", important: true, url: "" },
                { time: "20:10", text: "✈️ 回程航班起飛 (20:10-20:50)", important: true, url: "" }
            ]}
        ];

        const defaultFood = [
            { day: 1, title: "Day 1 推薦美食", items: [] },
            { day: 2, title: "Day 2 行程周邊美食特搜", items: [
                { name: "🍙 在地熱門飯糰", desc: "沖繩必吃人氣飯糰，份量厚實。", url: "https://maps.app.goo.gl/iCcXRwDSWE83Bpoa9" },
                { name: "🦐 經典蝦蝦飯", desc: "古宇利島必訪名物，蒜香濃郁的絕佳滋味。", url: "https://maps.app.goo.gl/cyJTFsrKNi6TELP69" },
                { name: "☕ 質感海景咖啡廳", desc: "適合午後休憩，享受沖繩海風與咖啡。", url: "https://maps.app.goo.gl/PmWr42B5LaVNHogj6" },
                { name: "🍱 道地定食餐廳", desc: "充滿日本家庭風味的定食料理。", url: "https://maps.app.goo.gl/PmWr42B5LaVNHogj6" },
                { name: "🥩 燒肉本部牧場 (本部總店)", desc: "頂級和牛與本部牛燒肉，肉質鮮甜入口即化！", url: "https://maps.app.goo.gl/opzRj1a1cBJWKRqX6" },
                { name: "☕ 星巴克 (沖繩特色店)", desc: "絕佳海景或具備在地建築特色的星巴克門市。", url: "https://maps.app.goo.gl/3qVCPNcnvrUhmo756" }
            ]},
            { day: 3, title: "Day 3 推薦美食", items: [] }
        ];

        const requiredChecklist = [
            { id: "c1", cat: "個人物品", text: "護照", checked: false },
            { id: "c2", cat: "個人物品", text: "信用卡", checked: false },
            { id: "c3", cat: "個人物品", text: "身分證", checked: false },
            { id: "c4", cat: "個人物品", text: "現金", checked: false },
            { id: "c5", cat: "個人物品", text: "身分證影本", checked: false },
            { id: "c6", cat: "個人物品", text: "護照影本", checked: false },
            { id: "c7", cat: "個人物品", text: "台灣駕照", checked: false },
            { id: "c8", cat: "個人物品", text: "國際駕照", checked: false },
            { id: "c9", cat: "個人物品", text: "駕照譯本", checked: false },
            { id: "c10", cat: "雜物", text: "衣物、帽子", checked: false },
            { id: "c11", cat: "雜物", text: "太陽眼鏡", checked: false },
            { id: "c12", cat: "雜物", text: "隱形眼鏡、梳子", checked: false },
            { id: "c13", cat: "雜物", text: "保養品(乳液、護手霜、洗臉)", checked: false },
            { id: "c14", cat: "雜物", text: "常備藥品(感冒、暈車、過敏、腸胃)", checked: false },
            { id: "c15", cat: "電子產品", text: "充電器、充電線", checked: false },
            { id: "c16", cat: "電子產品", text: "行動電源", checked: false },
            { id: "c17", cat: "電子產品", text: "萬國插座", checked: false },
            { id: "c18", cat: "電子產品", text: "GoPro/相機", checked: false },
            { id: "c19", cat: "電子產品", text: "GoPro/相機充電器、電池", checked: false },
            { id: "c20", cat: "電子產品", text: "記憶卡", checked: false },
            { id: "c21", cat: "電子產品", text: "網卡、SIM卡針", checked: false }
        ];

        // 加上 _v2 後綴以避免讀取到先前的舊版測試資料
        const STORAGE_KEY = 'muji_v2_'; 

        let appState = {
            currentTab: 'plan',
            cover: localStorage.getItem(STORAGE_KEY+'cover') || "https://images.unsplash.com/photo-1542640244-7e672d6cef4e?q=80&w=600&auto=format&fit=crop",
            plan: JSON.parse(localStorage.getItem(STORAGE_KEY+'plan')) || defaultPlan,
            food: JSON.parse(localStorage.getItem(STORAGE_KEY+'food')) || defaultFood,
            checklist: JSON.parse(localStorage.getItem(STORAGE_KEY+'checklist')) || requiredChecklist,
            memos: JSON.parse(localStorage.getItem(STORAGE_KEY+'memos')) || [
                { id: "m1", text: "Visit Japan Web 快速通關網址：https://vjw-lp.digital.go.jp/" }
            ],
            shopping: JSON.parse(localStorage.getItem(STORAGE_KEY+'shopping')) || [],
            wallet: JSON.parse(localStorage.getItem(STORAGE_KEY+'wallet')) || { rate: 0.215, history: [] },
            info: JSON.parse(localStorage.getItem(STORAGE_KEY+'info')) || {
                hotel: "住宿資訊 (可點擊編輯)\nURL: https://maps.app.goo.gl/WF7LqC5Ly8G5PkXx9",
                carRental: "取車/還車資訊",
                carAddress: "",
                carPhoto: ""
            }
        };

        function saveState() {
            localStorage.setItem(STORAGE_KEY+'plan', JSON.stringify(appState.plan));
            localStorage.setItem(STORAGE_KEY+'food', JSON.stringify(appState.food));
            localStorage.setItem(STORAGE_KEY+'checklist', JSON.stringify(appState.checklist));
            localStorage.setItem(STORAGE_KEY+'memos', JSON.stringify(appState.memos));
            localStorage.setItem(STORAGE_KEY+'shopping', JSON.stringify(appState.shopping));
            localStorage.setItem(STORAGE_KEY+'wallet', JSON.stringify(appState.wallet));
            localStorage.setItem(STORAGE_KEY+'info', JSON.stringify(appState.info));
        }

        window.onload = function() {
            document.getElementById('coverImage').src = appState.cover;
            switchTab(appState.currentTab);
        };

        // 壓縮上傳的圖片 (Canvas 壓縮)
        function compressImage(file, maxWidth, quality, callback) {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function(event) {
                const img = new Image();
                img.src = event.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;

                    if (width > maxWidth) {
                        height = Math.round((height * maxWidth) / width);
                        width = maxWidth;
                    }
                    canvas.width = width;
                    canvas.height = height;

                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    callback(canvas.toDataURL('image/jpeg', quality));
                };
            };
        }

        function uploadCover(input) {
            if (input.files && input.files[0]) {
                compressImage(input.files[0], 600, 0.7, function(base64Str) {
                    appState.cover = base64Str;
                    localStorage.setItem(STORAGE_KEY+'cover', base64Str);
                    document.getElementById('coverImage').src = base64Str;
                });
            }
        }

        function linkify(text) {
            const urlRegex = /(https?:\/\/[^\s]+)/g;
            return text.replace(urlRegex, function(url) {
                return `<a href="${url}" target="_blank" class="inline-block mt-1 text-xs text-[#4B6E7D] bg-[#4B6E7D]/10 px-2.5 py-1 rounded-md font-bold border border-[#4B6E7D]/20 shadow-sm transition hover:bg-[#4B6E7D]/20"><i class="fa-solid fa-arrow-up-right-from-square mr-1"></i>開啟連結</a>`;
            });
        }

        function openImageModal(src) {
            if(!src) return;
            document.getElementById('modalTargetImg').src = src;
            document.getElementById('imageModal').classList.remove('hidden');
        }
        function closeImageModal() {
            document.getElementById('imageModal').classList.add('hidden');
        }

        // ==========================================
        // 頁面導航切換
        // ==========================================
        let activeDayPlan = 1;
        function switchTab(tabId) {
            appState.currentTab = tabId;
            const tabs = ['plan', 'food', 'wallet', 'lists', 'info'];
            tabs.forEach(t => {
                const btn = document.getElementById(`nav-${t}`);
                if (t === tabId) {
                    btn.classList.remove('text-neutral-400');
                    btn.classList.add('text-[#8C7667]');
                } else {
                    btn.classList.remove('text-[#8C7667]');
                    btn.classList.add('text-neutral-400');
                }
            });

            const main = document.getElementById('mainContent');
            if (tabId === 'plan') renderPlanTab(main);
            else if (tabId === 'food') renderFoodTab(main);
            else if (tabId === 'wallet') renderWalletTab(main);
            else if (tabId === 'lists') renderListsTab(main);
            else if (tabId === 'info') renderInfoTab(main);
        }

        // ==========================================
        // 1. PLAN 行程表
        // ==========================================
        function renderPlanTab(container) {
            let html = `
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-bold tracking-wider text-[#5C4A42] font-['Klee_One']"><i class="fa-regular fa-compass mr-1"></i> 日程表</h2>
                    <div class="inline-flex bg-white rounded-lg border border-[#E6E1DA] p-1 shadow-sm text-xs font-bold">
            `;
            appState.plan.forEach(d => {
                const activeClass = d.day === activeDayPlan ? 'bg-[#8C7667] text-white' : 'text-neutral-500 hover:text-neutral-800';
                html += `<button onclick="activeDayPlan=${d.day}; switchTab('plan')" class="px-3 py-1.5 rounded-md transition ${activeClass}">D${d.day}</button>`;
            });
            html += `</div></div>`;

            const currentDayData = appState.plan.find(d => d.day === activeDayPlan);
            html += `<div class="text-xs text-[#8C7667] mb-4 font-bold bg-[#EADFC9]/30 border border-[#EADFC9] rounded-lg px-3 py-2"><i class="fa-regular fa-clock mr-1"></i> 第 ${activeDayPlan} 天 — ${currentDayData.date}</div>`;

            html += `<div class="relative pl-5 border-l-2 border-[#EADFC9] ml-2 space-y-5">`;
            currentDayData.items.forEach((item, idx) => {
                const timeColor = item.important ? 'bg-[#D9534F] text-white shadow-md ring-4 ring-red-50' : 'bg-[#EADFC9] text-[#5C4A42]';
                const textColor = item.important ? 'font-bold text-[#D9534F]' : 'font-medium text-neutral-700';
                
                html += `
                    <div class="relative group">
                        <span class="absolute -left-[35px] top-1 px-1.5 py-0.5 text-[10px] rounded font-bold tracking-wider ${timeColor}">${item.time}</span>
                        <div class="muji-card p-3.5">
                            <p class="text-[13px] ${textColor} leading-relaxed">${item.text}</p>
                            <div class="mt-2 flex flex-wrap gap-2 items-center justify-between">
                                <div>
                                    ${item.url ? `<a href="${item.url}" target="_blank" class="text-[11px] font-bold text-[#4B6E7D] bg-[#4B6E7D]/5 border border-[#4B6E7D]/20 px-2 py-1 rounded-md shadow-sm"><i class="fa-solid fa-map-location-dot mr-1"></i>Google Map</a>` : ''}
                                </div>
                                <button onclick="deletePlanItem(${activeDayPlan}, ${idx})" class="text-[11px] text-neutral-300 hover:text-red-400 bg-neutral-50 px-2 py-1 rounded border border-neutral-100"><i class="fa-regular fa-trash-can"></i></button>
                            </div>
                        </div>
                    </div>
                `;
            });
            html += `</div>`;

            html += `
                <div class="muji-card p-4 mt-6 bg-neutral-50/50">
                    <h3 class="text-xs font-bold text-[#8C7667] mb-2"><i class="fa-solid fa-plus mr-1"></i>新增 D${activeDayPlan} 行程</h3>
                    <div class="grid grid-cols-4 gap-2 mb-2">
                        <input type="text" id="newPlanTime" placeholder="12:00" class="col-span-1 border border-[#E6E1DA] rounded text-xs p-2 focus:outline-none focus:border-[#8C7667] bg-white">
                        <input type="text" id="newPlanText" placeholder="行程描述..." class="col-span-3 border border-[#E6E1DA] rounded text-xs p-2 focus:outline-none focus:border-[#8C7667] bg-white">
                    </div>
                    <input type="text" id="newPlanUrl" placeholder="Google Maps 網址 (選填)" class="w-full border border-[#E6E1DA] rounded text-xs p-2 mb-3 focus:outline-none focus:border-[#8C7667] bg-white">
                    <div class="flex items-center justify-between">
                        <label class="text-xs text-neutral-500 flex items-center font-bold">
                            <input type="checkbox" id="newPlanImportant" class="mr-1.5 w-3.5 h-3.5 accent-[#D9534F]"> 醒目標示(如出發時間)
                        </label>
                        <button onclick="addPlanItem(${activeDayPlan})" class="muji-btn-primary text-xs font-bold px-4 py-1.5 rounded-lg shadow-sm"><i class="fa-solid fa-check mr-1"></i>加入</button>
                    </div>
                </div>
            `;
            container.innerHTML = html;
        }

        function addPlanItem(dayNum) {
            const time = document.getElementById('newPlanTime').value.trim() || "00:00";
            const text = document.getElementById('newPlanText').value.trim();
            const url = document.getElementById('newPlanUrl').value.trim();
            const important = document.getElementById('newPlanImportant').checked;
            if (!text) return alert('請輸入行程內容！');
            const targetDay = appState.plan.find(d => d.day === dayNum);
            targetDay.items.push({ time, text, url, important });
            targetDay.items.sort((a,b) => a.time.localeCompare(b.time));
            saveState(); switchTab('plan');
        }

        function deletePlanItem(dayNum, index) {
            if(confirm('確定要刪除此行程嗎？')) {
                appState.plan.find(d => d.day === dayNum).items.splice(index, 1);
                saveState(); switchTab('plan');
            }

        function updateRate(val) {
            let r = parseFloat(val);
            if (r > 0) { appState.wallet.rate = r; saveState(); }
        }

        function calcKey(key) {
            const expD = document.getElementById('calcExpDisplay');
            const resD = document.getElementById('calcResultDisplay');
            const twdD = document.getElementById('calcTwdDisplay');

            if(key === 'C') {
                calcExp = ""; expD.innerText = "0"; resD.innerText = "0"; twdD.innerText = "≈ NT$ 0";
            } else if(key === '=') {
                try {
                    if(!calcExp) return;
                    let sanitized = calcExp.replace(/[^0-9+\-*/().]/g, '');
                    let finalVal = eval(sanitized);
                    expD.innerText = calcExp + " =";
                    resD.innerText = Math.round(finalVal * 100) / 100;
                    twdD.innerText = "≈ NT$ " + Math.round(finalVal * appState.wallet.rate);
                    
                    if(document.getElementById('expAmount')) {
                        document.getElementById('expAmount').value = Math.round(finalVal * 100) / 100;
                        document.getElementById('expCurrency').value = "JPY";
                    }
                } catch(e) { resD.innerText = "錯誤"; }
            } else {
                calcExp += key; expD.innerText = calcExp;
            }
        }

        function addExpense() {
            const item = document.getElementById('expItem').value.trim();
            const currency = document.getElementById('expCurrency').value;
            const amount = parseFloat(document.getElementById('expAmount').value);
            const photo = document.getElementById('expPhoto').files[0];

            if(!item || isNaN(amount) || amount <= 0) return alert('請填寫完整正確的品項與金額！');

            const now = new Date();
            const timeStr = `${now.getMonth()+1}/${now.getDate()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
            let twd = currency === 'JPY' ? amount * appState.wallet.rate : amount;
            let origStr = currency === 'JPY' ? `¥ ${amount}` : `NT$ ${amount}`;

            const finish = (b64 = "") => {
                appState.wallet.history.unshift({ item, time: timeStr, twd, origStr, photo: b64 });
                saveState(); switchTab('wallet');
            };

            if (photo) compressImage(photo, 300, 0.5, finish);
            else finish("");
        }

                        <div id="view-${type}" class="space-y-3">
                            <div class="text-[13px] text-neutral-700 leading-relaxed font-medium whitespace-pre-wrap">${linkify(contentText)}</div>
                            ${isCar && appState.info.carAddress ? `<a href="${appState.info.carAddress}" target="_blank" class="inline-block text-[11px] font-bold text-[#4B6E7D] bg-[#4B6E7D]/5 border border-[#4B6E7D]/20 px-3 py-1.5 rounded-md shadow-sm"><i class="fa-solid fa-location-arrow mr-1"></i>開啟導航</a>` : ''}
                            ${isCar ? `
                                <label class="inline-block ml-2 text-[11px] bg-[#EADFC9]/50 border border-[#EADFC9] font-bold px-3 py-1.5 rounded-md cursor-pointer text-[#8C7667] transition hover:bg-[#EADFC9]">
                                    <i class="fa-solid fa-camera mr-1"></i>附加照片/合約
                                    <input type="file" accept="image/*" class="hidden" onchange="uploadInfoPhoto(this)">
                                </label>
                            ` : ''}
                            ${isCar && appState.info.carPhoto ? `<div class="mt-2"><img src="${appState.info.carPhoto}" class="w-full h-40 object-cover rounded-lg shadow-sm border border-neutral-200" onclick="openImageModal('${appState.info.carPhoto}')"></div>` : ''}
                        </div>

                        <div id="edit-${type}" class="hidden space-y-2 mt-2">
                            <textarea id="edit-${type}-text" class="w-full text-xs p-2.5 border border-[#E6E1DA] rounded-lg bg-neutral-50 focus:outline-none focus:border-[#8C7667]" rows="3">${contentText}</textarea>
                            ${isCar ? `<input type="text" id="edit-car-address" value="${appState.info.carAddress}" placeholder="請貼上 Google Map 網址" class="w-full text-xs p-2.5 border border-[#E6E1DA] rounded-lg bg-neutral-50 focus:outline-none focus:border-[#8C7667]">` : ''}
                        </div>
                    </div>
                `;
            });

            // 實用連結與注意
            html += `
                <div class="grid grid-cols-2 gap-3 mb-4">
                    <a href="https://www.jma.go.jp/bosai/map.html" target="_blank" class="muji-card p-3 text-center transition hover:bg-neutral-50 flex flex-col items-center justify-center h-20">
                        <i class="fa-solid fa-cloud-sun-rain text-amber-500 text-xl mb-1.5"></i>
                        <div class="text-xs font-bold text-neutral-700">日本氣象廳</div>
                    </a>
                    <a href="https://www.boca.gov.tw" target="_blank" class="muji-card p-3 text-center transition hover:bg-neutral-50 flex flex-col items-center justify-center h-20">
                        <i class="fa-solid fa-passport text-[#4B6E7D] text-xl mb-1.5"></i>
                        <div class="text-xs font-bold text-neutral-700">領務局違禁品</div>
                    </a>
                </div>

                <div class="muji-card p-4 mb-2 bg-red-50/30 border-red-100">
                    <h3 class="text-xs font-bold text-[#D9534F] mb-3"><i class="fa-solid fa-triangle-exclamation mr-1"></i>緊急與注意事項</h3>
                    <ul class="text-[11px] text-neutral-700 space-y-2 list-disc pl-4 leading-relaxed font-medium">
                        <li>日本緊急求助：警察局 <span class="text-red-500 font-bold">110</span>，救護車 <span class="text-red-500 font-bold">119</span></li>
                        <li>駐那霸辦事處：+81 98-862-7008 (急難救助專線)</li>
                        <li>自駕法規：日本為<span class="text-red-600 font-bold">右駕左行</span>，行人路權絕對優先。</li>
                        <li>免稅拆封：裝入日本免稅專用密封袋之商品，出境前切勿拆封。</li>
                    </ul>
                </div>
            `;
            container.innerHTML = html;
        }

        function toggleEdit(type) {
            const viewDiv = document.getElementById(`view-${type}`);
            const editDiv = document.getElementById(`edit-${type}`);
            const btn = document.getElementById(`btn-edit-${type}`);

            if (editDiv.classList.contains('hidden')) {
                viewDiv.classList.add('hidden');
                editDiv.classList.remove('hidden');
                btn.innerHTML = `<i class="fa-solid fa-check mr-1 text-green-600"></i>儲存`;
            } else {
                if (type === 'hotel') appState.info.hotel = document.getElementById('edit-hotel-text').value;
                else if (type === 'car') {
                    appState.info.carRental = document.getElementById('edit-car-text').value;
                    appState.info.carAddress = document.getElementById('edit-car-address').value;
                }
                saveState(); switchTab('info');
            }
        }

        function uploadInfoPhoto(input) {
            if (input.files && input.files[0]) {
                compressImage(input.files[0], 500, 0.6, function(base64) {
                    appState.info.carPhoto = base64; saveState(); switchTab('info');
                });
            }
        }
    </script>
</body>
</html>
