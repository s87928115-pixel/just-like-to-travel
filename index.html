<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- PWA 基礎設定 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="沖繩慢旅">
    
    <!-- 【圖示終極修復】利用 Blob 動態生成 Web Manifest，強制系統抓取 LocalStorage 內的圖片 -->
    <script>
        (function() {
            var STORAGE_KEY = 'muji_v5_';
            var savedCover = localStorage.getItem(STORAGE_KEY + 'cover');
            var iconHref = savedCover ? savedCover : "https://images.unsplash.com/photo-1542640244-7e672d6cef4e?q=80&w=200&auto=format&fit=crop";
            
            // 強制寫入 apple-touch-icon
            document.write('<link id="apple-icon" rel="apple-touch-icon" href="' + iconHref + '">');
            document.write('<link id="favicon" rel="icon" type="image/jpeg" href="' + iconHref + '">');
            
            // 生成虛擬的 manifest.json
            if(savedCover) {
                var manifest = {
                    "name": "沖繩慢旅", "short_name": "沖繩慢旅", "display": "standalone",
                    "icons": [{"src": savedCover, "sizes": "512x512", "type": "image/jpeg"}]
                };
                var blob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
                document.write('<link rel="manifest" href="' + URL.createObjectURL(blob) + '">');
            }
        })();
    </script>

    <title>沖繩夏日慢旅 - 精簡旅遊APP</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Klee One (無印手寫感) & Noto Sans TC -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #F7F5F0; /* 無印米色 */
            color: #4A3E3D; /* 無印咖啡色 */
            -webkit-tap-highlight-color: transparent;
        }
        h1, h2, .muji-title { font-family: 'Klee One', sans-serif; }
        .muji-card {
            background-color: #FFFFFF;
            border: 1px solid #E6E1DA;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(74, 62, 61, 0.05);
        }
        .muji-btn-primary { background-color: #8C7667; color: #FFFFFF; }
        .muji-btn-primary:active { background-color: #735F52; }
        .muji-btn-accent { background-color: #4B6E7D; color: #FFFFFF; } /* 無印藍 */
        .muji-btn-accent:active { background-color: #385563; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    </style>
</head>
<body class="pb-24 max-w-md mx-auto relative min-h-screen shadow-2xl bg-[#F7F5F0]">

    <!-- 圖片放大 Modal -->

            <div class="flex justify-between items-end">
                <div>
                    <h1 class="text-white text-2xl font-bold tracking-widest muji-title">沖繩夏日慢旅</h1>

    <!-- 航班快訊 -->
    <div class="bg-[#EADFC9] mx-4 -mt-5 relative z-10 rounded-xl px-4 py-3 text-xs flex justify-between items-center text-[#5C4A42] font-medium shadow-md border border-[#D1C6B4]">
        <div class="flex flex-col items-center"><span class="text-[10px] text-[#8C7667] mb-0.5">去程 6/13</span><div class="font-bold text-sm tracking-wider">13:30 <i class="fa-solid fa-plane text-[10px] mx-1"></i> 15:55</div></div>

    <script>
        const STORAGE_KEY = 'muji_v5_'; 

        const defaultPlan = [

        const defaultFood = [

            { day: 2, title: "Day 2 行程周邊特搜", items: [

                { name: "🦐 經典蝦蝦飯", desc: "古宇利島名物，蒜香濃郁絕佳滋味。", url: "https://maps.app.goo.gl/cyJTFsrKNi6TELP69" },
                { name: "☕ 質感海景咖啡廳", desc: "享受沖繩海風與咖啡。", url: "https://maps.app.goo.gl/PmWr42B5LaVNHogj6" },
                { name: "🍱 道地定食餐廳", desc: "日本家庭風味定食料理。", url: "https://maps.app.goo.gl/PmWr42B5LaVNHogj6" },
                { name: "🥩 燒肉本部牧場 (總店)", desc: "頂級和牛，肉質鮮甜！", url: "https://maps.app.goo.gl/opzRj1a1cBJWKRqX6" },
                { name: "☕ 星巴克 (特色店)", desc: "絕佳海景或具備在地建築特色。", url: "https://maps.app.goo.gl/3qVCPNcnvrUhmo756" }
            ]},
            { day: 3, title: "Day 3 推薦美食", items: [] }
        ];

        const defaultChecklist = [
            { id: "c1", cat: "個人物品", text: "護照", checked: false }, { id: "c2", cat: "個人物品", text: "信用卡", checked: false }, { id: "c3", cat: "個人物品", text: "身分證", checked: false }, { id: "c4", cat: "個人物品", text: "現金", checked: false }, { id: "c5", cat: "個人物品", text: "身分證影本", checked: false }, { id: "c6", cat: "個人物品", text: "護照影本", checked: false }, { id: "c7", cat: "個人物品", text: "駕照", checked: false }, { id: "c8", cat: "個人物品", text: "國際駕照", checked: false }, { id: "c9", cat: "個人物品", text: "駕照譯本", checked: false },
            { id: "c10", cat: "雜物", text: "衣物", checked: false }, { id: "c11", cat: "雜物", text: "帽子", checked: false }, { id: "c12", cat: "雜物", text: "太陽眼鏡", checked: false }, { id: "c13", cat: "雜物", text: "隱眼", checked: false }, { id: "c14", cat: "雜物", text: "梳子", checked: false }, { id: "c15", cat: "雜物", text: "保養品(乳液、護手霜、洗臉的)", checked: false }, { id: "c16", cat: "雜物", text: "藥品(感冒、暈車、過敏、腸胃)", checked: false },
            { id: "c17", cat: "電子產品", text: "充電器", checked: false }, { id: "c18", cat: "電子產品", text: "充電線", checked: false }, { id: "c19", cat: "電子產品", text: "行動電源", checked: false }, { id: "c20", cat: "電子產品", text: "萬國插座", checked: false }, { id: "c21", cat: "電子產品", text: "GoPro/相機", checked: false }, { id: "c22", cat: "電子產品", text: "GoPro/相機充電器", checked: false }, { id: "c23", cat: "電子產品", text: "電池", checked: false }, { id: "c24", cat: "電子產品", text: "記憶卡", checked: false }, { id: "c25", cat: "電子產品", text: "網卡", checked: false }, { id: "c26", cat: "電子產品", text: "SIM卡針", checked: false }
        ];

        let appState = {
            currentTab: 'plan',
            cover: localStorage.getItem(STORAGE_KEY+'cover') || "https://images.unsplash.com/photo-1542640244-7e672d6cef4e?q=80&w=600&auto=format&fit=crop",
            plan: JSON.parse(localStorage.getItem(STORAGE_KEY+'plan')) || defaultPlan,
            food: JSON.parse(localStorage.getItem(STORAGE_KEY+'food')) || defaultFood,
            checklist: JSON.parse(localStorage.getItem(STORAGE_KEY+'checklist')) || defaultChecklist,
            memos: JSON.parse(localStorage.getItem(STORAGE_KEY+'memos')) || [{ id: "m1", text: "Visit Japan Web：https://vjw-lp.digital.go.jp/" }],
            shopping: JSON.parse(localStorage.getItem(STORAGE_KEY+'shopping')) || [],
            wallet: JSON.parse(localStorage.getItem(STORAGE_KEY+'wallet')) || { rate: 0.215, history: [] },
            info: JSON.parse(localStorage.getItem(STORAGE_KEY+'info')) || {
                hotel: "住宿資訊 (可點擊編輯)\nURL: https://maps.app.goo.gl/WF7LqC5Ly8G5PkXx9",
                carRental: "取車/還車資訊", carAddress: "", carPhoto: ""
            }
        };

        function saveState() {
            localStorage.setItem(STORAGE_KEY+'plan', JSON.stringify(appState.plan));
            localStorage.setItem(STORAGE_KEY+'food', JSON.stringify(appState.food));
            localStorage.setItem(STORAGE_KEY+'checklist', JSON.stringify(appState.checklist));
            localStorage.setItem(STORAGE_KEY+'memos', JSON.stringify(appState.memos));
            localStorage.setItem(STORAGE_KEY+'shopping', JSON.stringify(appState.shopping));
            localStorage.setItem(STORAGE_KEY+'wallet', JSON.stringify(appState.wallet));
            localStorage.setItem(STORAGE_KEY+'info', JSON.stringify(appState.info));
        }

        window.onload = function() {
            document.getElementById('coverImage').src = appState.cover;
            switchTab(appState.currentTab);
        };

        function compressImage(file, maxWidth, quality, callback) {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function(event) {
                const img = new Image();
                img.src = event.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width, height = img.height;
                    if (width > maxWidth) { height = Math.round((height * maxWidth) / width); width = maxWidth; }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    callback(canvas.toDataURL('image/jpeg', quality));
                };
            };
        }

        function uploadCover(input) {
            if (input.files && input.files[0]) {
                compressImage(input.files[0], 600, 0.7, function(base64Str) {
                    appState.cover = base64Str;
                    localStorage.setItem(STORAGE_KEY+'cover', base64Str);
                    document.getElementById('coverImage').src = base64Str;
                    // 同步修改網頁 icon 標籤
                    document.getElementById('apple-icon').href = base64Str;
                    document.getElementById('favicon').href = base64Str;
                    alert("✅ 封面已更換！\n\n【關鍵步驟】請務必在瀏覽器將網頁「下拉重新整理」一次，然後再點擊「加入主畫面」，圖示就會順利更新了！");
                });
            }
        }

        function linkify(text) {
            const urlRegex = /(https?:\/\/[^\s]+)/g;
            return text.replace(urlRegex, function(url) {
                return `<a href="${url}" target="_blank" class="inline-block mt-1.5 text-[11px] font-bold text-[#4B6E7D] bg-[#4B6E7D]/10 border border-[#4B6E7D]/20 px-2.5 py-1 rounded-md shadow-sm transition hover:bg-[#4B6E7D]/20"><i class="fa-solid fa-arrow-up-right-from-square mr-1"></i>開啟地圖/連結</a>`;
            });
        }

        function openImageModal(src) { if(!src) return; document.getElementById('modalTargetImg').src = src; document.getElementById('imageModal').classList.remove('hidden'); }
        function closeImageModal() { document.getElementById('imageModal').classList.add('hidden'); }

        let activeDayPlan = 1;
        function switchTab(tabId) {
            appState.currentTab = tabId;
            const tabs = ['plan', 'food', 'wallet', 'lists', 'info'];
            tabs.forEach(t => {
                const btn = document.getElementById(`nav-${t}`);
                if (t === tabId) { btn.classList.remove('text-[#A89F91]'); btn.classList.add('text-[#8C7667]'); } 
                else { btn.classList.remove('text-[#8C7667]'); btn.classList.add('text-[#A89F91]'); }
            });
            const main = document.getElementById('mainContent');
            if (tabId === 'plan') renderPlanTab(main);
            else if (tabId === 'food') renderFoodTab(main);
            else if (tabId === 'wallet') renderWalletTab(main);
            else if (tabId === 'lists') renderListsTab(main);
            else if (tabId === 'info') renderInfoTab(main);
            window.scrollTo(0, 0);
        }

        // ==========================================
        // 1. PLAN 行程表
        // ==========================================
        function renderPlanTab(container) {
            let html = `
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-bold text-[#5C4A42] muji-title"><i class="fa-regular fa-compass mr-1.5"></i>日程表</h2>
                    <div class="inline-flex bg-white rounded-lg border border-[#E6E1DA] p-1 shadow-sm text-xs font-bold">
            `;
            appState.plan.forEach(d => {
                const activeClass = d.day === activeDayPlan ? 'bg-[#8C7667] text-white shadow-sm' : 'text-[#A89F91] hover:text-[#5C4A42]';
                html += `<button onclick="activeDayPlan=${d.day}; switchTab('plan')" class="px-3.5 py-1.5 rounded-md transition ${activeClass}">D${d.day}</button>`;
            });
            html += `</div></div>`;

            const currentDay = appState.plan.find(d => d.day === activeDayPlan);
            html += `<div class="text-xs text-[#8C7667] mb-5 font-bold bg-[#EADFC9]/40 border border-[#D1C6B4]/50 rounded-lg px-3 py-2.5 tracking-wider"><i class="fa-regular fa-clock mr-1.5"></i>第 ${activeDayPlan} 天 — ${currentDay.date}</div>`;
            html += `<div class="relative pl-6 border-l-2 border-[#EADFC9] ml-2.5 space-y-5">`;
            currentDay.items.forEach((item, idx) => {
                const timeColor = item.important ? 'bg-[#D9534F] text-white shadow-md ring-4 ring-red-50' : 'bg-[#F5F2EB] text-[#5C4A42] border border-[#EADFC9]';
                const textColor = item.important ? 'font-bold text-[#D9534F]' : 'font-medium text-[#4A3E3D]';
                html += `
                    <div class="relative group">
                        <span class="absolute -left-[40px] top-1 px-1.5 py-0.5 text-[10px] rounded font-bold tracking-wider ${timeColor}">${item.time}</span>
                        <div class="muji-card p-4 hover:border-[#D1C6B4] transition-colors">
                            <p class="text-[14px] ${textColor} leading-relaxed whitespace-pre-wrap">${item.text}</p>
                            <div class="mt-2.5 flex flex-wrap gap-2 items-center justify-between">
                                <div>${item.url ? linkify(item.url) : ''}</div>
                                <button onclick="deletePlanItem(${activeDayPlan}, ${idx})" class="text-[11px] text-neutral-300 hover:text-[#D9534F] bg-neutral-50 px-2 py-1 rounded"><i class="fa-regular fa-trash-can"></i></button>
                            </div>
                        </div>
                    </div>
                `;
            });
            html += `</div>
                <div class="muji-card p-4 mt-8 bg-neutral-50/50 border-dashed border-[#D1C6B4]">
                    <h3 class="text-xs font-bold text-[#8C7667] mb-3"><i class="fa-solid fa-plus mr-1"></i>新增行程 (D${activeDayPlan})</h3>
                    <div class="grid grid-cols-4 gap-2.5 mb-2.5">
                        <input type="text" id="newPlanTime" placeholder="時間" class="col-span-1 border border-[#E6E1DA] rounded-md text-xs p-2.5 bg-white shadow-inner focus:outline-none focus:border-[#8C7667]">
                        <input type="text" id="newPlanText" placeholder="行程描述..." class="col-span-3 border border-[#E6E1DA] rounded-md text-xs p-2.5 bg-white shadow-inner focus:outline-none focus:border-[#8C7667]">
                    </div>
                    <input type="text" id="newPlanUrl" placeholder="Google Maps 網址 (選填)" class="w-full border border-[#E6E1DA] rounded-md text-xs p-2.5 mb-3 bg-white shadow-inner focus:outline-none focus:border-[#8C7667]">

        function calcKey(key) {
            const expD=document.getElementById('calcExpDisplay'), resD=document.getElementById('calcResultDisplay'), twdD=document.getElementById('calcTwdDisplay');
            if(key==='C'){ calcExp=""; expD.innerText="0"; resD.innerText="0"; twdD.innerText="≈ NT$ 0"; }
            else if(key==='='){
                try{ if(!calcExp)return; let v=eval(calcExp.replace(/[^0-9+\-*/().]/g,'')); expD.innerText=calcExp+" ="; resD.innerText=Math.round(v*100)/100; twdD.innerText="≈ NT$ "+Math.round(v*appState.wallet.rate);
                if(document.getElementById('expAmount')){ document.getElementById('expAmount').value=Math.round(v*100)/100; document.getElementById('expCurrency').value="JPY"; }
                }catch(e){resD.innerText="錯誤";}
            }else{ calcExp+=key; expD.innerText=calcExp; }
        }

            let twd=curr==='JPY'?amount*appState.wallet.rate:amount, origStr=curr==='JPY'?`¥ ${amount}`:`NT$ ${amount}`;
            const finish=(b="")=>{ appState.wallet.history.unshift({item,time:timeStr,twd,origStr,photo:b}); saveState(); switchTab('wallet'); };
            if(photo) compressImage(photo,300,0.5,finish); else finish("");

                            ${isCar&&appState.info.carAddress ? `<a href="${appState.info.carAddress}" target="_blank" class="inline-block text-[11px] font-bold text-white bg-[#4B6E7D] px-3.5 py-1.5 rounded-md shadow-sm"><i class="fa-solid fa-location-arrow mr-1.5"></i>地圖導航</a>` : ''}
                            ${isCar ? `<label class="inline-block ml-2 text-[11px] bg-[#F5F2EB] border border-[#D1C6B4] font-bold px-3.5 py-1.5 rounded-md cursor-pointer text-[#8C7667] hover:bg-[#EADFC9] transition"><i class="fa-solid fa-camera mr-1.5"></i>附加照片/合約<input type="file" accept="image/*" class="hidden" onchange="uploadInfo(this)"></label>` : ''}
                            ${isCar&&appState.info.carPhoto ? `<div class="mt-3"><img src="${appState.info.carPhoto}" class="w-full h-44 object-cover rounded-lg shadow-sm border border-[#E6E1DA]" onclick="openImageModal('${appState.info.carPhoto}')"></div>` : ''}
                        </div>
                        <div id="edit-${type}" class="hidden space-y-2.5 mt-2">
                            <textarea id="e-${type}-text" class="w-full text-xs p-3 border border-[#E6E1DA] rounded-lg bg-[#F7F5F0] focus:outline-none focus:border-[#8C7667]" rows="3">${text}</textarea>
                            ${isCar ? `<input type="text" id="e-car-url" value="${appState.info.carAddress}" placeholder="Google Maps 地址連結" class="w-full text-xs p-3 border border-[#E6E1DA] rounded-lg bg-[#F7F5F0] focus:outline-none focus:border-[#8C7667]">` : ''}
                        </div>
                    </div>`;
            });
            html += `
                <div class="grid grid-cols-2 gap-3 mb-5">
                    <a href="https://www.jma.go.jp/bosai/map.html" target="_blank" class="muji-card p-3 flex flex-col items-center h-20 justify-center hover:bg-neutral-50 transition"><i class="fa-solid fa-cloud-sun-rain text-amber-500 text-2xl mb-1.5"></i><div class="text-[11px] font-bold text-[#5C4A42] tracking-widest">日本氣象廳</div></a>
                    <a href="https://www.boca.gov.tw" target="_blank" class="muji-card p-3 flex flex-col items-center h-20 justify-center hover:bg-neutral-50 transition"><i class="fa-solid fa-passport text-[#4B6E7D] text-2xl mb-1.5"></i><div class="text-[11px] font-bold text-[#5C4A42] tracking-widest">領務局違禁品</div></a>
                </div>
                <div class="muji-card p-4 mb-2 bg-[#D9534F]/5 border-[#D9534F]/20">
                    <h3 class="text-xs font-bold text-[#D9534F] mb-3"><i class="fa-solid fa-triangle-exclamation mr-1.5"></i>緊急與注意事項</h3>
                    <ul class="text-[11px] text-[#4A3E3D] space-y-2.5 list-disc pl-4 font-medium leading-relaxed">
                        <li>日本緊急求助：警察局 <span class="text-[#D9534F] font-bold">110</span>，救護車 <span class="text-[#D9534F] font-bold">119</span></li>
                        <li>駐那霸辦事處急難救助：+81 98-862-7008</li>
                        <li>自駕法規：日本為<span class="text-[#D9534F] font-bold">右駕左行</span>，行人路權絕對優先，切勿隨意右轉。</li>
                        <li>免稅規定：裝入免稅專用密封袋之商品出境前請勿拆封。</li>
                    </ul>
                </div>`;
            container.innerHTML = html;
        }

        function toggleEdit(type) {
            const v = document.getElementById(`view-${type}`), e = document.getElementById(`edit-${type}`), b = document.getElementById(`btn-edit-${type}`);
            if(e.classList.contains('hidden')){ v.classList.add('hidden'); e.classList.remove('hidden'); b.innerHTML=`<i class="fa-solid fa-check mr-1 text-green-600"></i>完成`; }
            else { 
                if(type==='hotel')appState.info.hotel=document.getElementById('e-hotel-text').value; 
                else{appState.info.carRental=document.getElementById('e-car-text').value;appState.info.carAddress=document.getElementById('e-car-url').value;}
                saveState(); switchTab('info');
            }
        }
        function uploadInfo(i) { if(i.files&&i.files[0]){compressImage(i.files[0],500,0.6,(b)=>{appState.info.carPhoto=b;saveState();switchTab('info');});} }
    </script>
</body>
</html>
