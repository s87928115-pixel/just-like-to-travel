<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>沖繩夏日慢旅 - 精簡旅遊APP</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Noto Sans TC', 'Zen Maru Gothic', sans-serif;
            background-color: #F7F5F0; /* 無印經典米白 */
            color: #4A3E3D; /* 深木褐 */
        }
        .muji-card {
            background-color: #FFFFFF;
            border: 1px solid #E6E1DA;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(74, 62, 61, 0.03);
        }
        .muji-btn-primary {
            background-color: #8C7667; /* 暖褐 */
            color: #FFFFFF;
        }
        .muji-btn-primary:active {
            background-color: #735F52;
        }
        .muji-btn-secondary {
            background-color: #EADFC9; /* 淡米黃 */
            color: #5C4A42;
        }
        .muji-btn-accent {
            background-color: #4B6E7D; /* 沉穩海藍 */
            color: #FFFFFF;
        }
        /* 隱藏滾動條 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="pb-24 max-w-md mx-auto relative min-h-screen shadow-xl bg-neutral-50">

    <div id="imageModal" class="fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center p-4" onclick="closeImageModal()">
        <img id="modalTargetImg" src="" class="max-w-full max-h-[80vh] rounded-lg shadow-2xl object-contain">
    </div>

    <header class="relative w-full h-48 bg-neutral-300 overflow-hidden group">
        <img id="coverImage" src="https://images.unsplash.com/photo-1542640244-7e672d6cef4e?q=80&w=600&auto=format&fit=crop" class="w-full h-full object-cover">
        <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent flex flex-col justify-end p-4">
            <div class="flex justify-between items-end">
                <div>
                    <h1 class="text-white text-2xl font-bold tracking-wide">沖繩文青慢旅</h1>
                    <p class="text-neutral-200 text-xs mt-1"><i class="fa-regular fa-calendar-days mr-1"></i> 6/13 - 6/15 (3天2夜)</p>
                </div>
                <label class="bg-white/20 text-white text-xs px-2 py-1 rounded backdrop-blur-sm cursor-pointer hover:bg-white/30 transition">
                    <i class="fa-solid fa-camera mr-1"></i>換封面
                    <input type="file" id="coverUpload" accept="image/*" class="hidden" onchange="uploadCover(this)">
                </label>
            </div>
        </div>
    </header>

    <div class="bg-[#EADFC9] px-4 py-2 text-xs flex justify-between items-center text-[#5C4A42] font-medium shadow-sm">
        <div><i class="fa-solid fa-plane-departure mr-1"></i> 去程 6/13 <span class="font-bold">13:30 → 15:55</span></div>
        <div class="w-px h-3 bg-[#5C4A42]/30"></div>
        <div><i class="fa-solid fa-plane-arrival mr-1"></i> 回程 6/15 <span class="font-bold">20:10 → 20:50</span></div>
    </div>

    <main class="p-4" id="mainContent">
        </main>

    <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-[#E6E1DA] h-16 flex justify-around items-center z-40 px-2">
        <button onclick="switchTab('plan')" id="nav-plan" class="flex flex-col items-center justify-center w-14 text-xs text-[#8C7667] font-medium transition">
            <i class="fa-regular fa-compass text-lg mb-1"></i><span>行程</span>
        </button>
        <button onclick="switchTab('food')" id="nav-food" class="flex flex-col items-center justify-center w-14 text-xs text-neutral-400 font-medium transition">
            <i class="fa-solid fa-utensils text-lg mb-1"></i><span>美食</span>
        </button>
        <button onclick="switchTab('wallet')" id="nav-wallet" class="flex flex-col items-center justify-center w-14 text-xs text-neutral-400 font-medium transition">
            <i class="fa-solid fa-wallet text-lg mb-1"></i><span>記帳</span>
        </button>
        <button onclick="switchTab('lists')" id="nav-lists" class="flex flex-col items-center justify-center w-14 text-xs text-neutral-400 font-medium transition">
            <i class="fa-solid fa-list-check text-lg mb-1"></i><span>清單</span>
        </button>
        <button onclick="switchTab('info')" id="nav-info" class="flex flex-col items-center justify-center w-14 text-xs text-neutral-400 font-medium transition">
            <i class="fa-solid fa-circle-info text-lg mb-1"></i><span>資訊</span>
        </button>
    </nav>

    <script>

                { time: "11:30", text: "🏝️ 古宇利島、古宇利大橋絕景", important: false, url: "https://maps.google.com/?q=Kouri+Island" },
                { time: "13:00", text: "🦐 午餐：名物蝦蝦飯 or 頂級阿古豬料理", important: false, url: "" },

                { time: "19:35", text: "🛍️ 國際通繁華街自由購物與晚餐時間", important: false, url: "https://maps.google.com/?q=Kokusai+Dori" }
            ]},
            { day: 3, date: "6/15 (一)", items: [
                { time: "10:00", text: "🛍️ 浦添 PARCO CITY 大型商場購物 (營業 10:00–22:00)", important: true, url: "https://maps.google.com/?q=PARCO+CITY+Okinawa" },

                { time: "20:10", text: "✈️ 那霸起飛返回台灣", important: true, url: "" },
                { time: "20:50", text: "🛬 順利抵達台灣，期待下次旅行", important: false, url: "" }

        const defaultFood = [
            { day: 1, title: "Day 1 美國村與異國風情餐飲", items: [
                { name: "琉球島豚 麵屋", desc: "主打濃厚沖繩黑豬肉湯頭，叉燒肥而不膩，極具在地風味。", url: "https://maps.google.com/?q=美國村+拉麵" },
                { name: "A&W 美式漢堡", desc: "沖繩限定的連鎖美式漢堡，獨特麥根沙士必點！", url: "https://maps.google.com/?q=AW+American+Village" }
            ]},
            { day: 2, title: "Day 2 北部海景與經典珍饈", items: [
                { name: "古宇利島蝦蝦飯 (Kouri Shrimp)", desc: "蒜香濃郁、蝦肉Q彈彈牙，搭配美麗的古宇利藍海景，視覺味覺雙享受。", url: "https://maps.google.com/?q=Kouri+Shrimp" },
                { name: "百年古家 大家 (Ufuya)", desc: "在百年琉球古宅中享用頂級阿古豬(Agu)涮涮鍋，肉質甘甜油花均勻。", url: "https://maps.google.com/?q=百年古家+大家" }
            ]},
            { day: 3, title: "Day 3 浦添商場美食與特色甜點", items: [
                { name: "敘敘苑 (PARCO CITY店)", desc: "一邊眺望蔚藍海景一邊享用頂級燒肉商業午餐，性價比極高！", url: "https://maps.google.com/?q=敘敘苑+PARCO+CITY" },
                { name: "Blue Seal 冰淇淋", desc: "沖繩代名詞，推薦鹽金楚糕與紅芋口味，濃郁順口。", url: "https://maps.google.com/?q=Blue+Seal+Okinawa" }
            ]}
        ];

        const requiredChecklist = [
            { id: "c1", cat: "個人物品", text: "護照", checked: false },
            { id: "c2", cat: "個人物品", text: "信用卡", checked: false },
            { id: "c3", cat: "個人物品", text: "身分證", checked: false },
            { id: "c4", cat: "個人物品", text: "現金 (日圓/台幣)", checked: false },
            { id: "c5", cat: "個人物品", text: "身分證與護照影本", checked: false },
            { id: "c6", cat: "個人物品", text: "台灣駕照+日文譯本+國際駕照", checked: false },
            { id: "c7", cat: "雜物", text: "換洗衣物與帽子", checked: false },
            { id: "c8", cat: "雜物", text: "太陽眼鏡", checked: false },
            { id: "c9", cat: "雜物", text: "隱形眼鏡/保養液/梳子", checked: false },
            { id: "c10", cat: "雜物", text: "日常保養品 (乳液、護手霜、洗面乳)", checked: false },
            { id: "c11", cat: "雜物", text: "常備藥品 (感冒、暈車、過敏、腸胃藥)", checked: false },
            { id: "c12", cat: "電子產品", text: "手機充電器與充電線", checked: false },
            { id: "c13", cat: "電子產品", text: "行動電源 (需隨身攜帶登機)", checked: false },
            { id: "c14", cat: "電子產品", text: "萬國轉接插座", checked: false },
            { id: "c15", cat: "電子產品", text: "GoPro/相機及其充電器與電池", checked: false },
            { id: "c16", cat: "電子產品", text: "備用記憶卡", checked: false },
            { id: "c17", cat: "電子產品", text: "日本上網卡 (網卡/eSIM) & SIM卡針", checked: false }
        ];

        // 載入或初始化 LocalStorage
        let appState = {
            currentTab: 'plan',
            cover: localStorage.getItem('muji_cover') || "https://images.unsplash.com/photo-1542640244-7e672d6cef4e?q=80&w=600&auto=format&fit=crop",
            plan: JSON.parse(localStorage.getItem('muji_plan')) || defaultPlan,
            food: JSON.parse(localStorage.getItem('muji_food')) || defaultFood,
            checklist: JSON.parse(localStorage.getItem('muji_checklist')) || requiredChecklist,
            memos: JSON.parse(localStorage.getItem('muji_memos')) || [
                { id: "m1", text: "記得出發前填寫日本 Visit Japan Web 快速通關！網址：https://vjw-lp.digital.go.jp/" }
            ],
            shopping: JSON.parse(localStorage.getItem('muji_shopping')) || [
                { id: "s1", text: "合利他命 EX Plus 270粒", url: "https://www.cosme.net", img: "", purchased: false }
            ],
            wallet: JSON.parse(localStorage.getItem('muji_wallet')) || {
                rate: 0.215, // 預設日圓對台幣匯率
                history: []
            },
            info: JSON.parse(localStorage.getItem('muji_info')) || {
                hotel: "那霸美居酒店 (Mercure Okinawa Naha)\n地址：沖繩縣那霸市壺川3-3-19\n電話：+81 98-855-7111",
                carRental: "豐田租車 (Toyota Rent-a-Car) 那霸機場店\n預約號碼：TYO-98765432\n取車請搭乘機場接駁巴士",
                carAddress: "https://maps.google.com/?q=Toyota+Rent+a+Car+Naha+Airport",
                carPhoto: ""
            }
        };

        // 保存全域資料
        function saveState() {
            localStorage.setItem('muji_plan', JSON.stringify(appState.plan));
            localStorage.setItem('muji_food', JSON.stringify(appState.food));
            localStorage.setItem('muji_checklist', JSON.stringify(appState.checklist));
            localStorage.setItem('muji_memos', JSON.stringify(appState.memos));
            localStorage.setItem('muji_shopping', JSON.stringify(appState.shopping));
            localStorage.setItem('muji_wallet', JSON.stringify(appState.wallet));
            localStorage.setItem('muji_info', JSON.stringify(appState.info));
        }

        // 頁面初次載入
        window.onload = function() {
            document.getElementById('coverImage').src = appState.cover;
            switchTab(appState.currentTab);
        };

        // 更換封面相片 (壓縮後轉 Base64 儲存)
        function uploadCover(input) {
            if (input.files && input.files[0]) {
                compressImage(input.files[0], 600, 0.7, function(base64Str) {
                    appState.cover = base64Str;
                    localStorage.setItem('muji_cover', base64Str);
                    document.getElementById('coverImage').src = base64Str;
                });
            }
        }

        // 核心底層：圖片壓縮函數 (Canvas 壓成 Base64 避免 LocalStorage 超量)
        function compressImage(file, maxWidth, quality, callback) {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function(event) {
                const img = new Image();
                img.src = event.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;

                    if (width > maxWidth) {
                        height = Math.round((height * maxWidth) / width);
                        width = maxWidth;
                    }
                    canvas.width = width;
                    canvas.height = height;

                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    const dataUrl = canvas.toDataURL('image/jpeg', quality);
                    callback(dataUrl);
                };
            };
        }

        // 實用輔助：文字自動轉 URL 超連結按鈕
        function linkify(text) {
            const urlRegex = /(https?:\/\/[^\s]+)/g;
            return text.replace(urlRegex, function(url) {
                return `<a href="${url}" target="_blank" class="inline-block mt-1 text-xs text-[#4B6E7D] bg-[#4B6E7D]/10 px-2 py-0.5 rounded font-medium border border-[#4B6E7D]/20"><i class="fa-solid fa-arrow-up-right-from-square mr-1"></i>外部連結</a>`;
            });
        }

        // 圖片全螢幕檢視
        function openImageModal(src) {
            if(!src) return;
            document.getElementById('modalTargetImg').src = src;
            document.getElementById('imageModal').classList.remove('hidden');
        }
        function closeImageModal() {
            document.getElementById('imageModal').classList.add('hidden');
        }

        // 翻頁導覽頁面切換核心
        let activeDayPlan = 1; // PLAN 專用當前天數
        function switchTab(tabId) {
            appState.currentTab = tabId;
            
            // 更新導航鈕外觀
            const tabs = ['plan', 'food', 'wallet', 'lists', 'info'];
            tabs.forEach(t => {
                const btn = document.getElementById(`nav-${t}`);
                if (t === tabId) {
                    btn.classList.remove('text-neutral-400');
                    btn.classList.add('text-[#8C7667]');
                } else {
                    btn.classList.remove('text-[#8C7667]');
                    btn.classList.add('text-neutral-400');
                }
            });

            // 渲染選定模組
            const main = document.getElementById('mainContent');
            if (tabId === 'plan') renderPlanTab(main);
            else if (tabId === 'food') renderFoodTab(main);
            else if (tabId === 'wallet') renderWalletTab(main);
            else if (tabId === 'lists') renderListsTab(main);
            else if (tabId === 'info') renderInfoTab(main);
            
            window.scrollTo(0, 0);
        }

        // ==========================================
        // 1. PLAN 行程表模組
        // ==========================================
        function renderPlanTab(container) {
            let html = `
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-bold tracking-wider text-[#5C4A42]"><i class="fa-regular fa-compass mr-1"></i> 行程日程表</h2>
                    <div class="inline-flex bg-white rounded-md border border-[#E6E1DA] p-0.5 text-xs">
            `;
            appState.plan.forEach(d => {
                const activeClass = d.day === activeDayPlan ? 'bg-[#8C7667] text-white font-bold' : 'text-neutral-500 hover:text-neutral-800';
                html += `<button onclick="activeDayPlan=${d.day}; switchTab('plan')" class="px-2.5 py-1 rounded transition ${activeClass}">D${d.day}</button>`;
            });
            html += `</div></div>`;

            const currentDayData = appState.plan.find(d => d.day === activeDayPlan);
            html += `<div class="text-xs text-neutral-500 mb-3 font-medium bg-white border border-[#E6E1DA] rounded px-3 py-1.5"><i class="fa-regular fa-clock mr-1"></i>目前檢視：第 ${activeDayPlan} 天 — ${currentDayData.date}</div>`;

            // 時間軸主體
            html += `<div class="relative pl-4 border-l-2 border-[#EADFC9] ml-2 space-y-4">`;
            currentDayData.items.forEach((item, idx) => {
                const timeColor = item.important ? 'bg-[#4B6E7D] text-white ring-4 ring-[#4B6E7D]/20' : 'bg-[#EADFC9] text-[#5C4A42]';
                const textColor = item.important ? 'font-bold text-[#4B6E7D]' : 'text-neutral-700';
                
                html += `
                    <div class="relative group">
                        <span class="absolute -left-7 top-0.5 px-1.5 py-0.5 text-[10px] rounded font-bold ${timeColor}">${item.time}</span>
                        <div class="muji-card p-3">
                            <p class="text-sm ${textColor} leading-relaxed">${item.text}</p>
                            
                            <div class="mt-2 flex flex-wrap gap-2 items-center">
                                ${item.url ? `<a href="${item.url}" target="_blank" class="text-[11px] font-medium text-[#8C7667] bg-[#F5F2EB] border border-[#E6E1DA] px-2 py-0.5 rounded"><i class="fa-solid fa-map-location-dot mr-1"></i>Google Map</a>` : ''}
                                <button onclick="deletePlanItem(${activeDayPlan}, ${idx})" class="text-[10px] text-red-400 hover:text-red-600 ml-auto"><i class="fa-regular fa-trash-can"></i></button>
                            </div>
                        </div>
                    </div>
                `;
            });
            html += `</div>`;

            // 動態新增行程文字與地圖
            html += `
                <div class="muji-card p-4 mt-6">
                    <h3 class="text-xs font-bold uppercase tracking-wider text-neutral-400 mb-2"><i class="fa-solid fa-plus mr-1"></i>新增 D${activeDayPlan} 快速項目</h3>
                    <div class="grid grid-cols-4 gap-2 mb-2">
                        <input type="text" id="newPlanTime" placeholder="12:00" class="col-span-1 border border-[#E6E1DA] rounded text-xs p-2 focus:outline-none focus:border-[#8C7667] bg-neutral-50">
                        <input type="text" id="newPlanText" placeholder="景點或活動內容描述..." class="col-span-3 border border-[#E6E1DA] rounded text-xs p-2 focus:outline-none focus:border-[#8C7667] bg-neutral-50">
                    </div>
                    <input type="text" id="newPlanUrl" placeholder="可貼上 Google Maps 地圖網址 (選填)" class="w-full border border-[#E6E1DA] rounded text-xs p-2 mb-3 focus:outline-none focus:border-[#8C7667] bg-neutral-50">
                    <div class="flex items-center justify-between">
                        <label class="text-xs text-neutral-500 flex items-center">
                            <input type="checkbox" id="newPlanImportant" class="mr-1 accent-[#4B6E7D]"> 醒目提醒時間
                        </label>
                        <button onclick="addPlanItem(${activeDayPlan})" class="muji-btn-primary text-xs font-medium px-4 py-1.5 rounded shadow-sm"><i class="fa-solid fa-check mr-1"></i>加入行程</button>
                    </div>
                </div>
            `;
            container.innerHTML = html;
        }

        function addPlanItem(dayNum) {
            const time = document.getElementById('newPlanTime').value.trim() || "00:00";

        function pressCalc(key) {
            const expDisp = document.getElementById('calcExpDisplay');
            const resDisp = document.getElementById('calcResultDisplay');
            const twdDisp = document.getElementById('calcTwdDisplay');

            if(key === 'C') {
                calcExpression = "";
                expDisp.innerText = "0";
                resDisp.innerText = "0 JPY";
                twdDisp.innerText = "≈ NT$ 0";
            } else if(key === '=') {
                try {
                    // 安全計算數值
                    if(!calcExpression) return;
                    let sanitized = calcExpression.replace(/[^0-9+\-*/().]/g, '');
                    let finalVal = eval(sanitized);
                    
                    expDisp.innerText = calcExpression + " =";
                    resDisp.innerText = Math.round(finalVal * 100) / 100 + " JPY";
                    twdDisp.innerText = "≈ NT$ " + Math.round(finalVal * appState.wallet.rate);
                    
                    // 自動填入金額欄位，方便記帳
                    if(document.getElementById('expAmount')) {
                        document.getElementById('expAmount').value = Math.round(finalVal * 100) / 100;
                        document.getElementById('expCurrency').value = "JPY";
                    }
                } catch(e) {
                    resDisp.innerText = "錯誤";
                }
            } else {
                calcExpression += key;
                expDisp.innerText = calcExpression;
            }
        }

        function addExpense() {

            const now = new Date();
            const timeStr = `${now.getMonth()+1}/${now.getDate()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
            
            let twdAmount = 0;
            let origStr = "";
            if(currency === 'JPY') {
                twdAmount = amount * appState.wallet.rate;
                origStr = `¥ ${amount}`;
            } else {
                twdAmount = amount;
                origStr = `NT$ ${amount}`;
            }

            const completeRecord = (photoBase64 = "") => {
                appState.wallet.history.unshift({
                    item, time: timeStr, twd: twdAmount, origStr, photo: photoBase64

                switchTab('wallet');

            if (photoFile) {

            const url = document.getElementById('newShopUrl').value.trim();
            const file = document.getElementById('newShopPhoto').files[0];

            if(!text) { alert('請填寫物品名稱！'); return; }

            const proceed = (imgB64 = "") => {
                appState.shopping.push({ id: 's_'+Date.now(), text, url, img: imgB64, purchased: false });
                saveState();
                switchTab('lists');
            };

            if(file) {
                compressImage(file, 250, 0.5, function(b64) {
                    proceed(b64);
                });
            } else {
                proceed("");
            }
        }

        function toggleShopPurchased(idx) {
            appState.shopping[idx].purchased = !appState.shopping[idx].purchased;
            saveState();
            switchTab('lists');
        }

        function deleteShopItem(idx) {
            if(confirm('確認移除此採購項目嗎？')) {
                appState.shopping.splice(idx, 1);
                saveState();
                switchTab('lists');
            }
        }

        // ==========================================
        // 5. INFO 住宿、交通與實用資訊模組
        // ==========================================
        function renderInfoTab(container) {
            let html = `
                <div class="mb-4">
                    <h2 class="text-lg font-bold tracking-wider text-[#5C4A42]"><i class="fa-solid fa-circle-info mr-1"></i> 行程基本資訊</h2>
                </div>

                <div class="muji-card p-4 mb-4">
                    <div class="flex justify-between items-center mb-2">
                        <h3 class="text-xs font-bold uppercase tracking-wider text-[#8C7667]"><i class="fa-solid fa-hotel mr-1"></i>住宿飯店資訊</h3>
                        <button onclick="toggleEditInfo('hotel')" id="btn-edit-hotel" class="text-[11px] text-neutral-400"><i class="fa-regular fa-pen-to-square mr-0.5"></i>編輯</button>
                    </div>
                    <div id="view-hotel" class="text-xs text-neutral-700 leading-relaxed whitespace-pre-wrap bg-neutral-50 p-2.5 rounded border border-neutral-100">${appState.info.hotel}</div>
                    <textarea id="edit-hotel" class="hidden w-full text-xs p-2 border border-[#8C7667] rounded bg-white" rows="3">${appState.info.hotel}</textarea>
                </div>

                <div class="muji-card p-4 mb-4">
                    <div class="flex justify-between items-center mb-2">
                        <h3 class="text-xs font-bold uppercase tracking-wider text-[#8C7667]"><i class="fa-solid fa-car mr-1"></i>交通/租車合約資訊</h3>
                        <button onclick="toggleEditInfo('car')" id="btn-edit-car" class="text-[11px] text-neutral-400"><i class="fa-regular fa-pen-to-square mr-0.5"></i>編輯</button>
                    </div>
                    
                    <div id="view-car" class="space-y-2">
                        <div class="text-xs text-neutral-700 leading-relaxed whitespace-pre-wrap bg-neutral-50 p-2.5 rounded border border-neutral-100">${appState.info.carRental}</div>
                        
                        <div class="flex items-center gap-2 mt-2">
                            ${appState.info.carAddress ? `<a href="${appState.info.carAddress}" target="_blank" class="text-[11px] font-medium text-[#4B6E7D] bg-[#4B6E7D]/5 border border-[#4B6E7D]/20 px-3 py-1 rounded"><i class="fa-solid fa-location-arrow mr-1"></i>導航至還車店家</a>` : ''}
                            
                            <label class="text-[11px] bg-neutral-200/60 px-2 py-1 rounded cursor-pointer text-neutral-600 hover:bg-neutral-200">
                                <i class="fa-solid fa-camera mr-0.5"></i>上傳租車照/合約
                                <input type="file" accept="image/*" class="hidden" onchange="uploadCarPhoto(this)">
                            </label>
                        </div>

                        ${appState.info.carPhoto ? `<div class="mt-2"><img src="${appState.info.carPhoto}" class="w-full h-32 object-cover rounded-lg shadow-sm border border-neutral-200" onclick="openImageModal('${appState.info.carPhoto}')"><p class="text-[9px] text-center text-neutral-400 mt-1">▲ 點擊可放大檢視契約或車況照片</p></div>` : ''}
                    </div>

                    <div id="edit-car" class="hidden space-y-2">
                        <textarea id="edit-car-text" class="w-full text-xs p-2 border border-[#8C7667] rounded bg-white" rows="3">${appState.info.carRental}</textarea>
                        <input type="text" id="edit-car-address" value="${appState.info.carAddress}" placeholder="請貼上取還車點的 Google Map 網址" class="w-full text-xs p-2 border border-[#8C7667] rounded bg-white">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2 mb-4">
                    <a href="https://www.jma.go.jp/bosai/map.html" target="_blank" class="muji-card p-3 text-center bg-white hover:bg-neutral-50">
                        <i class="fa-solid fa-cloud-sun-rain text-amber-500 text-lg mb-1"></i>
                        <div class="text-xs font-bold text-neutral-700">日本氣象廳</div>
                        <div class="text-[9px] text-neutral-400 mt-0.5">即時天氣預報查詢</div>
                    </a>
                    <a href="https://www.boca.gov.tw" target="_blank" class="muji-card p-3 text-center bg-white hover:bg-neutral-50">
                        <i class="fa-solid fa-passport text-[#4B6E7D] text-lg mb-1"></i>
                        <div class="text-xs font-bold text-neutral-700">外交部領務局</div>
                        <div class="text-[9px] text-neutral-400 mt-0.5">出入境違禁品規定</div>
                    </a>
                </div>

                <div class="muji-card p-4 mb-2">
                    <h3 class="text-xs font-bold uppercase tracking-wider text-red-500 mb-2"><i class="fa-solid fa-triangle-exclamation mr-1"></i>緊急聯絡與旅遊注意</h3>
                    <ul class="text-[11px] text-neutral-600 space-y-1.5 list-disc pl-4 leading-relaxed">
                        <li><span class="font-bold text-neutral-800">日本緊急求助：</span>警察局撥打 <span class="text-red-500 font-bold">110</span>，救護車撥打 <span class="text-red-500 font-bold">119</span></li>
                        <li><span class="font-bold text-neutral-800">駐那霸辦事處：</span>+81 98-862-7008 (急難救助專線)</li>
                        <li><span class="font-bold text-neutral-800">自駕法規：</span>日本為<span class="text-red-600 font-bold">左側行駛(右駕)</span>，行人路權絕對優先，嚴禁違規左右轉與超速。</li>
                        <li><span class="font-bold text-neutral-800">免稅拆封：</span>裝入日本免稅專用密封袋之商品，出境前切勿拆封。</li>
                    </ul>
                </div>
            `;
            container.innerHTML = html;
        }

        function toggleEditInfo(type) {
            const viewDiv = document.getElementById(`view-${type}`);
            const editDiv = document.getElementById(`edit-${type}`);
            const btn = document.getElementById(`btn-edit-${type}`);

            if (editDiv.classList.contains('hidden')) {
                // 切換到編輯狀態
                viewDiv.classList.add('hidden');
                editDiv.classList.remove('hidden');
                btn.innerHTML = `<i class="fa-solid fa-check mr-0.5 text-green-600"></i>儲存`;
            } else {
                // 儲存並切換回顯示
                if (type === 'hotel') {
                    appState.info.hotel = document.getElementById('edit-hotel').value;
                } else if (type === 'car') {
                    appState.info.carRental = document.getElementById('edit-car-text').value;
                    appState.info.carAddress = document.getElementById('edit-car-address').value;
                }
                saveState();
                viewDiv.classList.remove('hidden');
                editDiv.classList.add('hidden');
                btn.innerHTML = `<i class="fa-regular fa-pen-to-square mr-0.5"></i>編輯`;
                switchTab('info');
            }
        }

        function uploadCarPhoto(input) {
            if (input.files && input.files[0]) {
                compressImage(input.files[0], 400, 0.6, function(base64) {
                    appState.info.carPhoto = base64;
                    saveState();
                    switchTab('info');
                });
            }
        }
    </script>
</body>
</html>
