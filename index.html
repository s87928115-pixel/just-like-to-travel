<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="沖繩慢旅">
    
    <script>
        (function() {
            var STORAGE_KEY = 'muji_v5_';
            var savedCover = localStorage.getItem(STORAGE_KEY + 'cover');
            var iconHref = savedCover ? savedCover : "https://images.unsplash.com/photo-1542640244-7e672d6cef4e?q=80&w=200&auto=format&fit=crop";
            
            document.write('<link id="apple-icon" rel="apple-touch-icon" href="' + iconHref + '">');
            document.write('<link id="favicon" rel="icon" type="image/jpeg" href="' + iconHref + '">');
            
            if(savedCover) {
                var manifest = {
                    "name": "沖繩慢旅", "short_name": "沖繩慢旅", "display": "standalone",
                    "icons": [{"src": savedCover, "sizes": "512x512", "type": "image/jpeg"}]
                };
                var blob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
                document.write('<link rel="manifest" href="' + URL.createObjectURL(blob) + '">');
            }
        })();
    </script>

    <title>沖繩夏日慢旅 - 精簡旅遊APP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #F7F5F0;
            color: #4A3E3D;
            -webkit-tap-highlight-color: transparent;
        }
        h1, h2, .muji-title { font-family: 'Klee One', sans-serif; }
        .muji-card {
            background-color: #FFFFFF;
            border: 1px solid #E6E1DA;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(74, 62, 61, 0.05);
        }
        .muji-btn-primary { background-color: #8C7667; color: #FFFFFF; }
        .muji-btn-primary:active { background-color: #735F52; }
        .muji-btn-accent { background-color: #4B6E7D; color: #FFFFFF; }
        .muji-btn-accent:active { background-color: #385563; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        [contenteditable="true"]:focus { outline: none; background-color: #F9F8F6; padding: 4px; border-radius: 4px; border: 1px dashed #D1C6B4; }
    </style>
</head>
<body class="pb-28 max-w-md mx-auto relative min-h-screen shadow-2xl bg-[#F7F5F0]">

    <div id="imageModal" class="fixed inset-0 bg-[#4A3E3D]/90 z-[60] hidden flex flex-col items-center justify-center p-4 backdrop-blur-sm" onclick="closeImageModal()">
        <img id="modalTargetImg" src="" class="max-w-full max-h-[80vh] rounded-lg shadow-2xl object-contain mb-4">
        <button class="bg-white/20 text-white px-6 py-2.5 rounded-full text-sm tracking-widest backdrop-blur-md border border-white/30">關閉</button>
    </div>

    <header class="relative w-full h-56 bg-[#E6E1DA] overflow-hidden rounded-b-[20px] shadow-sm">
        <img id="coverImage" src="" class="w-full h-full object-cover">
        <div class="absolute inset-0 bg-gradient-to-t from-[#4A3E3D]/80 via-transparent to-transparent flex flex-col justify-end p-5">
            <div class="flex justify-between items-end">
                <div>
                    <h1 class="text-white text-3xl font-bold tracking-widest muji-title">沖繩夏日慢旅</h1>
                    <p class="text-white/90 text-sm mt-1.5 tracking-wider"><i class="fa-regular fa-calendar-days mr-1"></i> 6/13 - 6/15</p>
                </div>
                <label class="bg-white/20 text-white text-sm px-4 py-2 rounded-full backdrop-blur-md cursor-pointer border border-white/30 shadow-sm flex items-center">
                    <i class="fa-solid fa-camera mr-1.5"></i>更換封面
                    <input type="file" id="coverUpload" accept="image/*" class="hidden" onchange="uploadCover(this)">
                </label>
            </div>
        </div>
    </header>

    <div class="bg-[#EADFC9] mx-4 -mt-5 relative z-10 rounded-xl px-4 py-3 text-sm flex justify-between items-center text-[#5C4A42] font-medium shadow-md border border-[#D1C6B4]">
        <div class="flex flex-col items-center"><span class="text-xs text-[#8C7667] mb-0.5">去程 6/13</span><div class="font-bold text-base tracking-wider">13:30 <i class="fa-solid fa-plane text-xs mx-1"></i> 15:55</div></div>
        <div class="w-px h-8 bg-[#8C7667]/30 mx-2"></div>
        <div class="flex flex-col items-center"><span class="text-xs text-[#8C7667] mb-0.5">回程 6/15</span><div class="font-bold text-base tracking-wider">20:10 <i class="fa-solid fa-plane text-xs mx-1"></i> 20:50</div></div>
    </div>

    <main class="p-4 mt-2" id="mainContent"></main>

    <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white/95 backdrop-blur-md border-t border-[#E6E1DA] h-[80px] flex justify-around items-center z-40 px-2 shadow-[0_-4px_20px_rgba(74,62,61,0.05)] pb-safe">
        <button onclick="switchTab('plan', false)" id="nav-plan" class="flex flex-col items-center justify-center w-16 text-sm font-medium transition text-[#8C7667]"><i class="fa-regular fa-compass text-2xl mb-1"></i><span>行程</span></button>
        <button onclick="switchTab('food', false)" id="nav-food" class="flex flex-col items-center justify-center w-16 text-sm font-medium transition text-[#A89F91]"><i class="fa-solid fa-utensils text-2xl mb-1"></i><span>美食</span></button>
        <button onclick="switchTab('wallet', false)" id="nav-wallet" class="flex flex-col items-center justify-center w-16 text-sm font-medium transition text-[#A89F91]"><i class="fa-solid fa-wallet text-2xl mb-1"></i><span>記帳</span></button>
        <button onclick="switchTab('lists', false)" id="nav-lists" class="flex flex-col items-center justify-center w-16 text-sm font-medium transition text-[#A89F91]"><i class="fa-solid fa-list-check text-2xl mb-1"></i><span>清單</span></button>
        <button onclick="switchTab('info', false)" id="nav-info" class="flex flex-col items-center justify-center w-16 text-sm font-medium transition text-[#A89F91]"><i class="fa-solid fa-circle-info text-2xl mb-1"></i><span>資訊</span></button>
    </nav>

    <script>
        const STORAGE_KEY = 'muji_v5_'; 

        const defaultPlan = [
            { day: 1, date: "6/13", items: [
                { time: "13:30", text: "✈️ 星宇航空起飛 (13:30-15:55)", important: true, url: "", photo: "" },
                { time: "16:30", text: "🚗 辦理租車手續", important: false, url: "", photo: "" },
                { time: "17:30", text: "🏨 抵達民宿 Check-in", important: false, url: "https://maps.app.goo.gl/MeW62ReoSn7VCpN49", photo: "" },
                { time: "18:00", text: "🐈 貓之道找貓", important: false, url: "https://maps.app.goo.gl/EvJRi6NRJBw4ktMn6", photo: "" },

                { time: "20:00", text: "🍽️ 享用晚餐", important: false, url: "", photo: "" }
            ]},
            { day: 2, date: "6/14", items: [
                { time: "09:30", text: "🏝️ 古宇利島絕景", important: false, url: "https://maps.app.goo.gl/A6KbengUB6K2rRbg9", photo: "" },
                { time: "11:30", text: "🦈 沖繩美麗海水族館", important: false, url: "https://maps.app.goo.gl/fnjwVkwC1VzncTLW9", photo: "" },
                { time: "13:30", text: "🍽️ 午餐", important: false, url: "", photo: "" },
                { time: "15:30", text: "⛩️ 波上宮參拜 (❗5點前抵達)", important: true, url: "https://maps.app.goo.gl/W3QwpRtVXTqjSLLw5", photo: "" },
                { time: "16:30", text: "🌅 瀨長島 (Umikaji Terrace)", important: false, url: "https://maps.app.goo.gl/B5SxaRWn8Dw76rjZ9", photo: "" },
                { time: "19:00", text: "🛍️ 國際通吃晚餐", important: false, url: "", photo: "" }
            ]},
            { day: 3, date: "6/15", items: [
                { time: "10:00", text: "🛍️ PARCO CITY 商場", important: false, url: "https://maps.app.goo.gl/5WQcTJTFEtC8THjB8", photo: "" },
                { time: "12:30", text: "🍽️ 午餐", important: false, url: "", photo: "" },
                { time: "14:00", text: "🚗 開車準備送機", important: false, url: "", photo: "" },
                { time: "15:00", text: "🛒 好市多採購", important: false, url: "https://maps.app.goo.gl/pepucERz8Zs2zqwH8", photo: "" },
                { time: "19:40", text: "🎒 準備搭機 (保留一個半小時)", important: true, url: "", photo: "" },
                { time: "20:10", text: "✈️ 星宇航空起飛 (20:10-20:50)", important: true, url: "", photo: "" }
            ]}
        ];

        const defaultFood = [
            { day: 1, title: "Day 1 推薦美食", items: [] },
            { day: 2, title: "Day 2 行程周邊特搜", items: [
                { name: "🍙 在地熱門飯糰", desc: "沖繩必吃人氣飯糰，份量厚實。", url: "https://maps.app.goo.gl/iCcXRwDSWE83Bpoa9" },
                { name: "🦐 經典蝦蝦飯", desc: "古宇利島名物，蒜香濃郁絕佳滋味。", url: "https://maps.app.goo.gl/cyJTFsrKNi6TELP69" },
                { name: "☕ 質感海景咖啡廳", desc: "享受沖繩海風與咖啡。", url: "https://maps.app.goo.gl/PmWr42B5LaVNHogj6" },
                { name: "🍱 道地定食餐廳", desc: "日本家庭風味定食料理。", url: "https://maps.app.goo.gl/PmWr42B5LaVNHogj6" },
                { name: "🥩 燒肉本部牧場 (總店)", desc: "頂級和牛，肉質鮮甜！", url: "https://maps.app.goo.gl/opzRj1a1cBJWKRqX6" },
                { name: "☕ 星巴克 (特色店)", desc: "絕佳海景或具備在地建築特色。", url: "https://maps.app.goo.gl/3qVCPNcnvrUhmo756" }
            ]},
            { day: 3, title: "Day 3 推薦美食", items: [] }
        ];

        const defaultChecklist = [
            { id: "c1", cat: "個人物品", text: "護照", checked: false }, { id: "c2", cat: "個人物品", text: "信用卡", checked: false }, { id: "c3", cat: "個人物品", text: "身分證", checked: false }, { id: "c4", cat: "個人物品", text: "現金", checked: false }, { id: "c5", cat: "個人物品", text: "身分證影本", checked: false }, { id: "c6", cat: "個人物品", text: "護照影本", checked: false }, { id: "c7", cat: "個人物品", text: "駕照", checked: false }, { id: "c8", cat: "個人物品", text: "國際駕照", checked: false }, { id: "c9", cat: "個人物品", text: "駕照譯本", checked: false },
            { id: "c10", cat: "雜物", text: "衣物", checked: false }, { id: "c11", cat: "雜物", text: "帽子", checked: false }, { id: "c12", cat: "雜物", text: "太陽眼鏡", checked: false }, { id: "c13", cat: "雜物", text: "隱眼", checked: false }, { id: "c14", cat: "雜物", text: "梳子", checked: false }, { id: "c15", cat: "雜物", text: "保養品", checked: false }, { id: "c16", cat: "雜物", text: "藥品", checked: false },
            { id: "c17", cat: "電子產品", text: "充電器", checked: false }, { id: "c18", cat: "電子產品", text: "充電線", checked: false }, { id: "c19", cat: "電子產品", text: "行動電源", checked: false }, { id: "c20", cat: "電子產品", text: "萬國插座", checked: false }, { id: "c21", cat: "電子產品", text: "相機", checked: false }, { id: "c25", cat: "電子產品", text: "網卡", checked: false }
        ];

        let appState = {
            currentTab: 'plan',
            currentListTab: 'baggage', // 新增：清單內的子分頁狀態
            cover: localStorage.getItem(STORAGE_KEY+'cover') || "https://images.unsplash.com/photo-1542640244-7e672d6cef4e?q=80&w=600&auto=format&fit=crop",
            plan: JSON.parse(localStorage.getItem(STORAGE_KEY+'plan')) || defaultPlan,
            food: JSON.parse(localStorage.getItem(STORAGE_KEY+'food')) || defaultFood,
            checklist: JSON.parse(localStorage.getItem(STORAGE_KEY+'checklist')) || defaultChecklist,
            memos: JSON.parse(localStorage.getItem(STORAGE_KEY+'memos')) || [{ id: "m1", text: "Visit Japan Web：https://vjw-lp.digital.go.jp/", photo: "" }],
            shopping: JSON.parse(localStorage.getItem(STORAGE_KEY+'shopping')) || [],
            wallet: JSON.parse(localStorage.getItem(STORAGE_KEY+'wallet')) || { rate: 0.215, history: [] },
            info: JSON.parse(localStorage.getItem(STORAGE_KEY+'info')) || {
                hotel: "住宿資訊 (可點擊編輯)\nURL: https://maps.app.goo.gl/WF7LqC5Ly8G5PkXx9",
                carRental: "取車/還車資訊", carAddress: "", carPhoto: ""
            }
        };

        function saveState() {
            localStorage.setItem(STORAGE_KEY+'plan', JSON.stringify(appState.plan));
            localStorage.setItem(STORAGE_KEY+'food', JSON.stringify(appState.food));
            localStorage.setItem(STORAGE_KEY+'checklist', JSON.stringify(appState.checklist));
            localStorage.setItem(STORAGE_KEY+'memos', JSON.stringify(appState.memos));
            localStorage.setItem(STORAGE_KEY+'shopping', JSON.stringify(appState.shopping));
            localStorage.setItem(STORAGE_KEY+'wallet', JSON.stringify(appState.wallet));
            localStorage.setItem(STORAGE_KEY+'info', JSON.stringify(appState.info));
        }

        window.onload = function() {
            document.getElementById('coverImage').src = appState.cover;
            switchTab(appState.currentTab, false);
        };

        function compressImage(file, maxWidth, quality, callback) {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function(event) {
                const img = new Image();
                img.src = event.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width, height = img.height;
                    if (width > maxWidth) { height = Math.round((height * maxWidth) / width); width = maxWidth; }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    callback(canvas.toDataURL('image/jpeg', quality));
                };
            };
        }

        function uploadCover(input) {
            if (input.files && input.files[0]) {
                compressImage(input.files[0], 600, 0.7, function(base64Str) {
                    appState.cover = base64Str;
                    localStorage.setItem(STORAGE_KEY+'cover', base64Str);
                    document.getElementById('coverImage').src = base64Str;
                    document.getElementById('apple-icon').href = base64Str;
                    document.getElementById('favicon').href = base64Str;
                    alert("✅ 封面已更換！\n\n【關鍵步驟】請務必在瀏覽器將網頁「下拉重新整理」一次，然後再點擊「加入主畫面」，圖示就會順利更新了！");
                });
            }
        }

        function linkify(text) {
            const urlRegex = /(https?:\/\/[^\s]+)/g;
            return text.replace(urlRegex, function(url) {
                return `<a href="${url}" target="_blank" class="inline-block mt-2 text-[12px] font-bold text-[#4B6E7D] bg-[#4B6E7D]/10 border border-[#4B6E7D]/20 px-3 py-1.5 rounded-md shadow-sm transition hover:bg-[#4B6E7D]/20"><i class="fa-solid fa-arrow-up-right-from-square mr-1"></i>開啟地圖/連結</a>`;
            });
        }

        function openImageModal(src) { if(!src) return; document.getElementById('modalTargetImg').src = src; document.getElementById('imageModal').classList.remove('hidden'); }
        function closeImageModal() { document.getElementById('imageModal').classList.add('hidden'); }

        let activeDayPlan = 1;

        // 加入 preventScroll 參數，若是資料更新引發的重繪則帶入 true，避免網頁跳到最上方
        function switchTab(tabId, preventScroll = false) {
            appState.currentTab = tabId;
            const tabs = ['plan', 'food', 'wallet', 'lists', 'info'];
            tabs.forEach(t => {
                const btn = document.getElementById(`nav-${t}`);
                if (t === tabId) { btn.classList.remove('text-[#A89F91]'); btn.classList.add('text-[#8C7667]'); } 
                else { btn.classList.remove('text-[#8C7667]'); btn.classList.add('text-[#A89F91]'); }
            });
            
            const main = document.getElementById('mainContent');
            if (tabId === 'plan') renderPlanTab(main);
            else if (tabId === 'food') renderFoodTab(main);
            else if (tabId === 'wallet') renderWalletTab(main);
            else if (tabId === 'lists') renderListsTab(main);
            else if (tabId === 'info') renderInfoTab(main);
            
            if (!preventScroll) {
                window.scrollTo(0, 0);
            }
        }

        // ==========================================
        // 1. PLAN 行程表
        // ==========================================
        function renderPlanTab(container) {
            let html = `
                <div class="flex justify-between items-center mb-5">
                    <h2 class="text-2xl font-bold text-[#5C4A42] muji-title"><i class="fa-regular fa-compass mr-2"></i>日程表</h2>
                    <div class="inline-flex bg-white rounded-lg border border-[#E6E1DA] p-1 shadow-sm text-sm font-bold">
            `;
            appState.plan.forEach(d => {
                const activeClass = d.day === activeDayPlan ? 'bg-[#8C7667] text-white shadow-sm' : 'text-[#A89F91] hover:text-[#5C4A42]';
                html += `<button onclick="activeDayPlan=${d.day}; switchTab('plan', false)" class="px-4 py-2 rounded-md transition ${activeClass}">D${d.day}</button>`;
            });
            html += `</div></div>`;

            const currentDay = appState.plan.find(d => d.day === activeDayPlan);
            html += `<div class="text-sm text-[#8C7667] mb-6 font-bold bg-[#EADFC9]/40 border border-[#D1C6B4]/50 rounded-lg px-4 py-3 tracking-wider"><i class="fa-regular fa-clock mr-1.5"></i>第 ${activeDayPlan} 天 — ${currentDay.date}</div>`;
            html += `<div class="relative pl-7 border-l-[3px] border-[#EADFC9] ml-3 space-y-6">`;
            currentDay.items.forEach((item, idx) => {
                const timeColor = item.important ? 'bg-[#D9534F] text-white shadow-md ring-4 ring-red-50' : 'bg-[#F5F2EB] text-[#5C4A42] border border-[#EADFC9]';
                const textColor = item.important ? 'font-bold text-[#D9534F]' : 'font-medium text-[#4A3E3D]';
                html += `
                    <div class="relative group">
                        <span class="absolute -left-[50px] top-1 px-1.5 py-0.5 text-xs rounded font-bold tracking-wider ${timeColor}">${item.time}</span>
                        <div class="muji-card p-4 hover:border-[#D1C6B4] transition-colors">
                            <p class="text-base ${textColor} leading-relaxed whitespace-pre-wrap" contenteditable="true" onblur="updatePlanText(${activeDayPlan}, ${idx}, this.innerText)">${item.text}</p>
                            
                            ${item.photo ? `<img src="${item.photo}" class="mt-3 w-full h-36 object-cover rounded-lg shadow-sm border border-[#E6E1DA]" onclick="openImageModal('${item.photo}')">` : ''}

                            <div class="mt-3 flex flex-wrap gap-2 items-center justify-between">
                                <div>${item.url ? linkify(item.url) : ''}</div>
                                <div class="flex gap-2">
                                    <label class="text-sm text-neutral-400 hover:text-[#4B6E7D] bg-neutral-50 px-3 py-1.5 rounded cursor-pointer border border-[#E6E1DA]">
                                        <i class="fa-solid fa-camera"></i>
                                        <input type="file" accept="image/*" class="hidden" onchange="uploadPlanPhoto(${activeDayPlan}, ${idx}, this)">
                                    </label>
                                    <button onclick="deletePlanItem(${activeDayPlan}, ${idx})" class="text-sm text-neutral-400 hover:text-[#D9534F] bg-neutral-50 px-3 py-1.5 rounded border border-[#E6E1DA]"><i class="fa-regular fa-trash-can"></i></button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
            html += `</div>
                <div class="muji-card p-5 mt-8 bg-neutral-50/50 border-dashed border-[#D1C6B4]">
                    <h3 class="text-sm font-bold text-[#8C7667] mb-4"><i class="fa-solid fa-plus mr-1"></i>新增行程 (D${activeDayPlan})</h3>
                    <div class="grid grid-cols-4 gap-3 mb-3">
                        <input type="text" id="newPlanTime" placeholder="時間" class="col-span-1 border border-[#E6E1DA] rounded-md text-sm p-3 bg-white shadow-inner focus:outline-none focus:border-[#8C7667]">
                        <input type="text" id="newPlanText" placeholder="行程描述..." class="col-span-3 border border-[#E6E1DA] rounded-md text-sm p-3 bg-white shadow-inner focus:outline-none focus:border-[#8C7667]">
                    </div>
                    <input type="text" id="newPlanUrl" placeholder="Google Maps 網址 (選填)" class="w-full border border-[#E6E1DA] rounded-md text-sm p-3 mb-4 bg-white shadow-inner focus:outline-none focus:border-[#8C7667]">
                    <div class="flex items-center justify-between">
                        <label class="text-sm text-[#8C7667] font-bold flex items-center cursor-pointer"><input type="
