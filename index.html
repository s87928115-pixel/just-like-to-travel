<!DOCTYPE html>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="泰飽了要走走">

    <!-- PWA & Apple Touch Icon 動態寫入腳本 -->
    <script>
        (function() {
            try {
                // 確保讀取與儲存使用同一個 Key
                const data = JSON.parse(localStorage.getItem('travelApp_TaiBaoLe_Final_v4'));
                const iconUrl = (data && data.info && data.info.coverImg) ? data.info.coverImg : 'https://images.unsplash.com/photo-1537996194471-e657df975ab4?auto=format&fit=crop&w=192&q=80';
                
                // 動態生成 iOS 主畫面圖示
                const appleLink = document.createElement('link');
                appleLink.rel = 'apple-touch-icon';
                appleLink.href = iconUrl;
                document.head.appendChild(appleLink);

                // 動態生成一般瀏覽器標籤頁圖示
                const stdLink = document.createElement('link');
                stdLink.rel = 'icon';
                stdLink.href = iconUrl;
                document.head.appendChild(stdLink);
            } catch (e) { console.error('PWA Icon Load Error', e); }
        })();
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Noto+Sans+TC:wght@400;500;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome -->

    <!-- Tailwind CSS -->

    <script>

            theme: {
                extend: {

                        beige: '#F7F5F0',

                        calmblue: '#4B6E7D',

    <style>

        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* 時間軸樣式 */
        .timeline-line { position: absolute; left: 15px; top: 20px; bottom: 0; width: 2px; background-color: rgba(140, 118, 103, 0.2); z-index: 0; }
        .timeline-dot { position: absolute; left: 11px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background-color: #D9534F; z-index: 1; border: 2px solid #FFF; box-shadow: 0 0 0 2px #D9534F; }

</head>
<body class="font-noto text-lg text-darkwood selection:bg-warmbrown/30">

<div class="max-w-md mx-auto min-h-screen relative shadow-2xl bg-beige overflow-hidden flex flex-col pb-safe">
    <!-- Header -->
    <header class="relative w-full h-48 bg-gray-200 shrink-0">
        <img id="headerCoverImg" src="" class="w-full h-full object-cover" alt="Cover">
        <div class="absolute inset-0 bg-gradient-to-t from-darkwood/70 via-darkwood/20 to-transparent"></div>
        <div class="absolute bottom-4 left-4 right-4">
            <h1 class="text-3xl font-klee font-bold text-white tracking-widest drop-shadow-md">泰飽了要走走</h1>
            <p class="text-sm font-zen text-white/90 mt-1">Bangkok Trip - 5 Days</p>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 overflow-y-auto no-scrollbar p-4 relative" id="mainContainer">
        
        <!-- 1. PLAN 行程 -->
        <section id="tab-plan" class="tab-content active">
            <!-- Day Selector -->
            <div class="flex overflow-x-auto no-scrollbar gap-3 mb-5" id="planDaySelector"></div>
            
            <div class="flex justify-between items-center mb-4 pl-2 border-l-4 border-warmbrown">
                <h2 class="text-2xl font-zen font-bold text-warmbrown" id="planDayTitle">DAY 1</h2>
                <button onclick="togglePlanManageMode()" id="planManageBtn" class="text-sm bg-warmbrown text-white px-3 py-1.5 rounded-full shadow-sm"><i class="fas fa-list-check mr-1"></i>管理行程</button>
            </div>

            <!-- 時間軸容器 -->
            <div class="relative pl-2" id="planTimelineContainer">
                <div class="timeline-line" id="timelineLine"></div>
                <div id="planItemsList" class="space-y-4">
                    <!-- 動態渲染行程單項 -->
                </div>
            </div>
            
            <!-- 預設按鈕：新增行程項 -->
            <button onclick="openPlanModal()" class="w-full mt-6 py-3 border-2 border-dashed border-warmbrown/40 text-warmbrown font-bold rounded-xl bg-white hover:bg-warmbrown/5 transition"><i class="fas fa-plus mr-2"></i>新增行程</button>
        </section>

        <!-- 行程編輯/新增 Modal (隱藏層) -->
        <div id="planModal" class="fixed inset-0 bg-darkwood/60 z-50 hidden flex flex-col justify-end">
            <div class="bg-beige w-full max-w-md mx-auto rounded-t-2xl p-5 shadow-2xl relative max-h-[90vh] overflow-y-auto">
                <button onclick="closePlanModal()" class="absolute top-4 right-4 text-gray-400 hover:text-darkwood text-xl"><i class="fas fa-times"></i></button>
                <h3 class="text-xl font-zen font-bold text-warmbrown mb-4 border-b border-warmbrown/20 pb-2" id="planModalTitle">新增行程</h3>
                
                <div class="space-y-3">
                    <div>
                        <label class="block text-sm font-bold mb-1 text-calmblue">時間 (選填)</label>
                        <input type="text" id="planItemTime" placeholder="例如: 09:25" class="w-full p-3 border border-gray-200 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-warmbrown text-lg">
                    </div>
                    <div>
                        <label class="block text-sm font-bold mb-1 text-calmblue">行程內容 / 網址 (必填)</label>
                        <textarea id="planItemText" rows="4" placeholder="輸入行程細節，貼上網址會自動轉換為按鈕..." class="w-full p-3 border border-gray-200 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-warmbrown text-lg"></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-bold mb-1 text-calmblue">附加照片 (選填)</label>
                        <div class="flex gap-2 items-start">
                            <label class="bg-calmblue/10 text-calmblue border border-calmblue/20 px-4 py-3 rounded-lg cursor-pointer flex-1 text-center font-bold text-sm hover:bg-calmblue/20 transition">
                                <i class="fas fa-camera mr-2"></i>上傳照片
                                <input type="file" accept="image/*" onchange="handlePlanItemImg(event)">
                            </label>
                            <img id="planItemImgPreview" src="" class="hidden h-16 w-16 object-cover rounded-lg border border-gray-200 shadow-sm">
                        </div>
                    </div>
                </div>
                
                <button onclick="savePlanItem()" class="w-full bg-warmbrown text-white py-3 rounded-xl font-bold mt-6 shadow-md text-lg"><i class="fas fa-save mr-2"></i>儲存行程</button>
            </div>
        </div>

        <!-- 2. FOOD 美食 -->
        <section id="tab-food" class="tab-content">
            <h2 class="text-2xl font-zen font-bold text-warmbrown mb-4 pl-2 border-l-4 border-warmbrown">曼谷美食地圖</h2>
            <div id="foodContainer" class="space-y-6"></div>
        </section>

        <!-- 3. WALLET 記帳 -->
        <section id="tab-wallet" class="tab-content">
            <div class="muji-card p-5 mb-5 bg-warmbrown/5 border-none">
                <h3 class="font-zen font-bold text-warmbrown mb-3"><i class="fas fa-calculator mr-2"></i>匯率計算機</h3>

                    <input type="number" id="walletRate" value="0.9" step="0.01" class="w-24 p-2 border rounded-lg bg-white text-darkwood font-bold text-center">
                </div>
                <div class="flex gap-2 items-center">
                    <input type="number" id="walletThb" placeholder="輸入當地金額" class="flex-1 p-3 border rounded-lg bg-white text-darkwood text-xl" oninput="calculateRate()">

                    <div class="flex-1 p-3 bg-white rounded-lg border text-center font-bold text-calmblue text-xl shadow-inner" id="walletTwd">0 TWD</div>

                <div class="flex justify-between items-center border-b border-warmbrown/20 pb-3 mb-4">

                    <span class="text-sm font-bold text-calmblue bg-calmblue/10 px-3 py-1 rounded-full">總計: <span id="walletTotal" class="text-lg">0</span> TWD</span>
                </div>

                    <input type="text" id="expenseName" placeholder="花費項目名稱" class="p-3 border border-gray-200 rounded-lg bg-white text-lg">
                    <div class="flex gap-2">
                        <input type="number" id="expenseCost" placeholder="金額 (TWD)" class="flex-1 p-3 border border-gray-200 rounded-lg bg-white text-lg">
                        <label class="bg-calmblue text-white px-5 py-3 rounded-lg cursor-pointer flex items-center justify-center shadow-sm">
                            <i class="fas fa-camera text-lg"></i>
                            <input type="file" accept="image/*" onchange="handleReceiptUpload(event)">
                        </label>
                    </div>
                    <img id="expenseReceiptPreview" class="hidden h-24 object-contain rounded-lg border border-gray-200 mt-2 bg-white p-1">
                    <button onclick="addExpense()" class="w-full bg-warmbrown text-white py-3 rounded-lg font-bold shadow-sm mt-2"><i class="fas fa-plus mr-1"></i>新增此筆花費</button>
                </div>

                <div id="expenseList" class="space-y-3"></div>
            </div>
        </section>

        <!-- 4. LISTS 清單 -->

                <button onclick="switchListTab('memo')" id="subtab-memo" class="flex-1 py-2.5 rounded-full font-bold text-warmbrown transition">備忘筆記</button>
                <button onclick="switchListTab('shop')" id="subtab-shop" class="flex-1 py-2.5 rounded-full font-bold text-warmbrown transition">採購型錄</button>
            </div>

            <!-- 行李 -->
            <div id="list-baggage" class="muji-card p-5">
                <div class="flex gap-2 mb-5">
                    <input type="text" id="baggageInput" placeholder="輸入要帶的物品..." class="flex-1 p-3 border border-gray-200 rounded-lg bg-beige/30 focus:bg-white text-lg">
                    <button onclick="addBaggage()" class="bg-calmblue text-white px-5 rounded-lg shadow-sm"><i class="fas fa-plus"></i></button>
                </div>
                <div id="baggageList" class="space-y-1"></div>
            </div>

            <!-- 備忘錄 -->

                    <div class="flex justify-between items-center mb-3 pb-2 border-b border-warmbrown/10">
                        <h3 class="font-zen font-bold text-warmbrown text-xl">自由筆記</h3>
                        <button onclick="toggleMemoEdit()" id="memoEditBtn" class="text-sm bg-warmbrown text-white px-4 py-1.5 rounded-full"><i class="fas fa-pen mr-1"></i>編輯</button>

                    <div id="memoViewMode" class="whitespace-pre-wrap leading-relaxed min-h-[120px] text-[1.1rem]"></div>
                    <div id="memoEditMode" class="hidden">
                        <textarea id="memoTextarea" class="w-full h-48 p-4 border border-warmbrown/30 rounded-xl bg-beige/30 mb-3 text-lg focus:bg-white"></textarea>
                        <div class="flex gap-2">
                            <label class="flex-1 text-center bg-calmblue text-white py-3 rounded-xl cursor-pointer font-bold shadow-sm">
                                <i class="fas fa-image mr-1"></i>附加圖片
                                <input type="file" accept="image/*" onchange="handleMemoImageUpload(event)">
                            </label>
                            <button onclick="saveMemoEdit()" class="flex-1 bg-warmbrown text-white py-3 rounded-xl font-bold shadow-sm"><i class="fas fa-save mr-1"></i>儲存</button>
                        </div>
                    </div>
                    <div id="memoImageContainer" class="mt-4 hidden relative">
                        <img id="memoImagePreview" src="" class="w-full rounded-xl shadow-sm border border-gray-200">
                        <button onclick="removeMemoImage()" class="absolute top-3 right-3 bg-white/90 text-highlight p-2.5 rounded-full shadow-md backdrop-blur"><i class="fas fa-trash"></i></button>
                    </div>
                </div>
            </div>

            <!-- 採購型錄 -->
            <div id="list-shop" class="hidden">

                        <input type="text" id="shopNameInput" placeholder="想買什麼？ (商品名稱)" class="p-3 border border-gray-200 rounded-lg bg-white text-lg">

                            <label class="flex-1 bg-white border border-gray-300 text-gray-500 py-3 rounded-lg cursor-pointer text-center font-bold text-sm shadow-sm hover:bg-gray-50">
                                <i class="fas fa-camera mr-1"></i>商品截圖
                                <input type="file" accept="image/*" onchange="handleShopImageTemp(event)">
                            </label>
                            <button onclick="addShopItem()" class="flex-1 bg-calmblue text-white rounded-lg shadow-sm font-bold text-sm"><i class="fas fa-plus mr-1"></i>加入清單</button>
                        </div>
                        <img id="shopImageTemp" class="hidden h-20 object-contain rounded bg-white p-1 border mx-auto">
                    </div>
                </div>
                <div id="shopGrid" class="grid grid-cols-2 gap-4"></div>
            </div>
        </section>

        <!-- 5. INFO 資訊 -->
        <section id="tab-info" class="tab-content">
            <div class="flex justify-between items-center mb-5">
                <h2 class="text-2xl font-zen font-bold text-warmbrown pl-2 border-l-4 border-warmbrown">旅途重要資訊</h2>
                <button onclick="toggleInfoEdit()" id="infoEditBtn" class="text-sm bg-warmbrown text-white px-4 py-1.5 rounded-full shadow-sm"><i class="fas fa-pen mr-1"></i>修改資料</button>
            </div>

            <div class="muji-card p-5 mb-5 bg-gradient-to-br from-white to-beige/50">
                <h3 class="font-zen font-bold text-warmbrown border-b border-warmbrown/20 pb-2 mb-4"><i class="fas fa-qrcode mr-2"></i>入境 QR Code / 簽證</h3>
                <div class="flex flex-col items-center">
                    <img id="infoQrCodePreview" src="" class="w-full max-w-[280px] rounded-xl shadow-md mb-4 hidden object-contain bg-white p-2 border">
                    <label id="qrCodeUploadLabel" class="bg-calmblue text-white px-6 py-3 rounded-full cursor-pointer font-bold shadow-md transition hover:bg-calmblue/90 hover:scale-105 transform">
                        <i class="fas fa-upload mr-2"></i>上傳條碼截圖
                        <input type="file" accept="image/*" onchange="handleQrCodeUpload(event)">
                    </label>
                    <button id="removeQrBtn" onclick="removeQrCode()" class="mt-2 text-gray-400 hover:text-highlight text-sm hidden font-bold underline"><i class="fas fa-trash mr-1"></i>移除並重新上傳</button>
                </div>
            </div>

            <!-- 住宿與航班 -->
            <div class="space-y-5" id="infoContainer">
                <!-- 內容由 JS 渲染 -->
            </div>

            <div class="muji-card p-5 mt-8 border-t-4 border-calmblue">
                <h3 class="font-zen font-bold text-calmblue mb-4 text-lg"><i class="fas fa-palette mr-2"></i>外觀設定</h3>
                <label class="block w-full text-center bg-beige border-2 border-dashed border-warmbrown/40 text-warmbrown py-4 rounded-xl cursor-pointer font-bold transition hover:bg-warmbrown/10 text-lg">
                    <i class="fas fa-image mr-2"></i>自訂首頁封面照片
                    <input type="file" accept="image/*" onchange="updateCoverImage(event)">
                </label>
                <p class="text-sm text-highlight mt-3 text-center font-bold">更換封面後，請將本網頁<span class="underline">先移除舊的捷徑</span>，再「重新加入主畫面」，圖示才會同步更新喔！</p>
            </div>
        </section>

    </main>

    <!-- Bottom Navigation -->
    <nav class="glass-nav absolute bottom-0 w-full h-[4.5rem] flex justify-around items-center z-40 rounded-t-3xl shadow-[0_-10px_40px_rgba(74,62,61,0.08)] px-2 pb-safe">
        <button onclick="switchTab('plan', this)" class="nav-btn active flex flex-col items-center justify-center w-16 h-full text-warmbrown transform transition active:scale-95">
            <i class="fas fa-calendar-alt text-2xl mb-1"></i>
            <span class="text-[11px] font-bold">行程</span>
        </button>
        <button onclick="switchTab('food', this)" class="nav-btn flex flex-col items-center justify-center w-16 h-full text-gray-400 hover:text-warmbrown transform transition active:scale-95">
            <i class="fas fa-utensils text-2xl mb-1"></i>
            <span class="text-[11px] font-bold">美食</span>
        </button>
        <button onclick="switchTab('wallet', this)" class="nav-btn flex flex-col items-center justify-center w-16 h-full text-gray-400 hover:text-warmbrown transform transition active:scale-95">
            <i class="fas fa-wallet text-2xl mb-1"></i>
            <span class="text-[11px] font-bold">記帳</span>
        </button>
        <button onclick="switchTab('lists', this)" class="nav-btn flex flex-col items-center justify-center w-16 h-full text-gray-400 hover:text-warmbrown transform transition active:scale-95">
            <i class="fas fa-list-check text-2xl mb-1"></i>
            <span class="text-[11px] font-bold">清單</span>
        </button>
        <button onclick="switchTab('info', this)" class="nav-btn flex flex-col items-center justify-center w-16 h-full text-gray-400 hover:text-warmbrown transform transition active:scale-95">
            <i class="fas fa-passport text-2xl mb-1"></i>
            <span class="text-[11px] font-bold">資訊</span>
        </button>
    </nav>
</div>

    // 圖片 Canvas 壓縮
    function compressImage(file, callback) {
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const MAX_WIDTH = 800; // 壓縮最大寬度，減少儲存負擔
                let width = img.width;
                let height = img.height;
                if (width > MAX_WIDTH) {
                    height = Math.round(height * (MAX_WIDTH / width));
                    width = MAX_WIDTH;
                }
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                // 壓縮為 JPEG 格式，品質 0.6 以平衡容量與畫質
                callback(canvas.toDataURL('image/jpeg', 0.6));
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    // 文字解析：超連結自動轉按鈕
    function parseText(text) {
        if (!text) return "";
        let parsed = text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
        const urlRegex = /(https?:\/\/[^\s\)]+)/g;
        parsed = parsed.replace(urlRegex, function(url) {
            return `<br><a href="${url}" target="_blank" class="inline-block my-1 px-4 py-1.5 bg-calmblue/10 text-calmblue border border-calmblue/20 rounded-full text-sm font-bold no-underline active:bg-calmblue/20 transition shadow-sm"><i class="fas fa-link mr-1"></i> 開啟連結</a>`;
        });
        return parsed;
    }

    function savePlanItem() {
        const time = document.getElementById('planItemTime').value.trim();
        const text = document.getElementById('planItemText').value.trim();
        
        if (!text) return alert('行程內容不可為空喔！');

        const dayItems = appData.plan[currentPlanIndex].items;

        if (editingItemObjId) {
            const item = dayItems.find(i => i.id === editingItemObjId);
            if (item) {
                item.time = time;
                item.text = text;
                item.img = tempPlanItemImg;
            }
        } else {
            dayItems.push({
                id: Date.now(), 
                time: time,
                text: text,
                img: tempPlanItemImg
            });
            // 根據時間自動排序
            dayItems.sort((a, b) => (a.time || "99:99").localeCompare(b.time || "99:99"));
        }

        saveData(appData);
        closePlanModal();
        renderPlan();
    }

    function deletePlanItem(itemId) {
        if(confirm('確定要刪除這個行程嗎？')) {
            const dayItems = appData.plan[currentPlanIndex].items;

            if(index > -1) {

                renderPlan();
            }
        }
    }

            tempShopImg = base64;
            const preview = document.getElementById('shopImageTemp');
            preview.src = base64;
            preview.classList.remove('hidden');
        });
    }

    function addShopItem() {
        const name = document.getElementById('shopNameInput').value.trim();
        if (!name) return alert('請輸入商品名稱');
        appData.lists.shop.unshift({ name, img: tempShopImg, done: false });
        saveData(appData);
        
        document.getElementById('shopNameInput').value = '';
        tempShopImg = '';
        document.getElementById('shopImageTemp').classList.add('hidden');
        renderShop();
    }

    function toggleShopItem(idx) {
        appData.lists.shop[idx].done = !appData.lists.shop[idx].done;
        saveData(appData);
        renderShop();
    }
    
    function deleteShopItem(idx) {
        if(confirm('從清單刪除此商品？')) {
            appData.lists.shop.splice(idx, 1);
            saveData(appData);
            renderShop();
        }
    }

    /* ================= 5. INFO 模組 ================= */
    let isInfoEditing = false;
    function renderInfo() {
        const qrPreview = document.getElementById('infoQrCodePreview');
        const removeBtn = document.getElementById('removeQrBtn');
        const uploadLabel = document.getElementById('qrCodeUploadLabel');

        if (appData.info.qrCodeImg) {
            qrPreview.src = appData.info.qrCodeImg;
            qrPreview.classList.remove('hidden');
            removeBtn.classList.remove('hidden');
            uploadLabel.classList.add('hidden');
        } else {
            qrPreview.classList.add('hidden');
            removeBtn.classList.add('hidden');
            uploadLabel.classList.remove('hidden');
        }

        const container = document.getElementById('infoContainer');
        if (isInfoEditing) {
            container.innerHTML = `
                <div class="muji-card p-5">
                    <h3 class="font-zen font-bold text-warmbrown mb-3 text-xl"><i class="fas fa-plane mr-2"></i>航班資訊</h3>
                    <textarea id="editInfoFlight" class="w-full h-40 p-3 border border-warmbrown/30 rounded-xl bg-beige/30 text-lg">${appData.info.flight}</textarea>
                </div>
                <div class="muji-card p-5">
                    <h3 class="font-zen font-bold text-warmbrown mb-3 text-xl"><i class="fas fa-hotel mr-2"></i>住宿資訊</h3>
                    <textarea id="editInfoAcc" class="w-full h-40 p-3 border border-warmbrown/30 rounded-xl bg-beige/30 text-lg">${appData.info.acc}</textarea>
                </div>
            `;
            document.getElementById('infoEditBtn').innerHTML = '<i class="fas fa-save mr-1"></i>儲存修改';
            document.getElementById('infoEditBtn').classList.replace('bg-warmbrown', 'bg-calmblue');
        } else {
            container.innerHTML = `
                <div class="muji-card p-5">
                    <h3 class="font-zen font-bold text-warmbrown border-b border-warmbrown/20 pb-2 mb-4 text-xl"><i class="fas fa-plane mr-2"></i>航班時刻</h3>
                    <div class="whitespace-pre-wrap text-[1.1rem] leading-loose">${parseText(appData.info.flight)}</div>
                </div>
                <div class="muji-card p-5">
                    <h3 class="font-zen font-bold text-warmbrown border-b border-warmbrown/20 pb-2 mb-4 text-xl"><i class="fas fa-hotel mr-2"></i>住宿與地址</h3>
                    <div class="whitespace-pre-wrap text-[1.1rem] leading-loose">${parseText(appData.info.acc)}</div>
                </div>
            `;
            document.getElementById('infoEditBtn').innerHTML = '<i class="fas fa-pen mr-1"></i>修改資料';
            document.getElementById('infoEditBtn').classList.replace('bg-calmblue', 'bg-warmbrown');
        }
        
        document.getElementById('headerCoverImg').src = appData.info.coverImg;
    }

    function toggleInfoEdit() {
        if (isInfoEditing) {
            appData.info.flight = document.getElementById('editInfoFlight').value;
            appData.info.acc = document.getElementById('editInfoAcc').value;
            saveData(appData);
        }
        isInfoEditing = !isInfoEditing;
        renderInfo();
    }

    function handleQrCodeUpload(event) {
        const file = event.target.files[0];
        if (!file) return;
        compressImage(file, (base64) => {
            appData.info.qrCodeImg = base64;
            saveData(appData);
            renderInfo();
        });
    }

    function removeQrCode() {
        if(confirm('確定要移除入境 QR Code 嗎？')) {
            appData.info.qrCodeImg = "";
            saveData(appData);
            renderInfo();
        }
    }

    function updateCoverImage(event) {
        const file = event.target.files[0];
        if (!file) return;
        compressImage(file, (base64) => {
            appData.info.coverImg = base64;
            saveData(appData);
            
            // 更新畫面中的大圖
            document.getElementById('headerCoverImg').src = base64;
            
            // 動態更新 DOM 上的 apple-touch-icon 與 icon
            let appleIcon = document.querySelector("link[rel='apple-touch-icon']");
            if (appleIcon) {
                appleIcon.href = base64;
            } else {
                appleIcon = document.createElement('link');
                appleIcon.rel = 'apple-touch-icon';
                appleIcon.href = base64;
                document.head.appendChild(appleIcon);
            }
            
            let stdIcon = document.querySelector("link[rel='icon']");
            if (stdIcon) {
                stdIcon.href = base64;
            } else {
                stdIcon = document.createElement('link');
                stdIcon.rel = 'icon';
                stdIcon.href = base64;
                document.head.appendChild(stdIcon);
            }

            alert('封面已更新成功！\n\n【重要提示】iOS Safari 會有快取機制。若要讓手機主畫面的捷徑顯示新圖示，請先刪除舊的捷徑，然後將本網頁「重新加入主畫面」。');
        });
    }

    /* ================= 初始化 ================= */
    window.onload = () => {
        renderPlan();
        renderFood();
        renderWallet();
        renderBaggage();
        renderMemo();
        renderShop();
        renderInfo();
    };

</script>
</body>
</html>
